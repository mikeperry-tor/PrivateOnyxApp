## Wrapper stack for sharing one Mysterium VPN namespace across SearxNG + Onyx.
##
## Use .env.wrapper for wrapper-specific image tags and host port mappings.
## Preferred entrypoints:
##   make up       (default lite mode)
##   make up-full  (full mode)

name: onyx

services:
  # VPN gateway for SearxNG-routed workloads
  myst-client:
    extends:
      file: ./myst/docker-compose.yaml
      service: myst-client
    labels:
      autoheal: "true"
    # Keep myst-client internal-only. Host port publishing is handled by
    # dedicated bridge proxies below so host access remains stable even when
    # VPN routing is active in this namespace.
    ports: []
    networks:
      default:
        aliases:
          - api_server
          - web_server
          - background
          - nginx
          - code-interpreter
    environment:
      # Optional LAN access bypass for local inference APIs / services.
      ALLOW_LAN_ACCESS: "${ALLOW_LAN_ACCESS:-false}"
    volumes: !override
      - ./docker-data/myst-data:/var/lib/mysterium-node
      - ./docker-data/myst-data:/root/.mysterium
      - ./myst/myst-client-entrypoint.sh:/usr/local/bin/myst-client-entrypoint.sh:ro

  searxng-core:
    extends:
      file: ./searxng/docker-compose.yml
      service: core
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    environment:
      SEARXNG_PORT: ${SEARXNG_CONTAINER_PORT:-8888}
    network_mode: "service:myst-client"
    volumes: !override
      - ./searxng/core-config/:/etc/searxng/:Z
      - ./docker-data/searxng-cache:/var/cache/searxng
    depends_on:
      myst-client:
        condition: service_healthy

  searxng-valkey:
    extends:
      file: ./searxng/docker-compose.yml
      service: valkey
    volumes: !override
      - ./docker-data/valkey:/data

  # Host-facing TCP bridges. These run on the normal compose network and
  # forward host traffic to services inside the myst-client namespace.
  host-web-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:3000,fork,reuseaddr tcp-connect:myst-client:80
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      myst-client:
        condition: service_started

  host-searxng-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${SEARXNG_CONTAINER_PORT:-8888},fork,reuseaddr tcp-connect:myst-client:${SEARXNG_CONTAINER_PORT:-8888}
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_CONTAINER_PORT:-8888}
    depends_on:
      myst-client:
        condition: service_started

  host-teep-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${TEEP_CONTAINER_PORT:-8337},fork,reuseaddr tcp-connect:myst-client:${TEEP_CONTAINER_PORT:-8337}
    ports:
      - ${TEEP_HOST:+${TEEP_HOST}:}${TEEP_PORT:-8337}:${TEEP_CONTAINER_PORT:-8337}
    depends_on:
      myst-client:
        condition: service_started

  host-doc-drop-web-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${DOC_DROP_WEB_PORT:-8091},fork,reuseaddr tcp-connect:myst-client:${DOC_DROP_WEB_CONTAINER_PORT:-8091}
    ports:
      - ${DOC_DROP_WEB_HOST:+${DOC_DROP_WEB_HOST}:}${DOC_DROP_WEB_PORT:-8091}:${DOC_DROP_WEB_CONTAINER_PORT:-8091}
    depends_on:
      myst-client:
        condition: service_started

  # Restarts containers marked with autoheal=true when Docker health is unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      myst-client:
        condition: service_started

  # Watches myst-client lifecycle and restarts containers sharing its netns
  # when myst-client is restarted/recreated.
  myst-netns-watchdog:
    image: docker:27-cli
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-onyx}
      MYST_NETNS_WATCH_INTERVAL: ${MYST_NETNS_WATCH_INTERVAL:-15}
    command:
      - /bin/sh
      - -ec
      - |
        last_started=""
        applied_started=""
        while true; do
          myst_id="$$(docker ps -q \
            --filter label=com.docker.compose.project=$${COMPOSE_PROJECT_NAME} \
            --filter label=com.docker.compose.service=myst-client | head -n1)"

          if [ -n "$$myst_id" ]; then
            started="$$(docker inspect -f '{{.State.StartedAt}}' "$$myst_id" 2>/dev/null || true)"
            health="$$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$$myst_id" 2>/dev/null || true)"

            if [ -n "$$started" ] && [ -z "$$applied_started" ]; then
              applied_started="$$started"
              last_started="$$started"
              echo "myst-netns-watchdog: baseline myst started_at=$$started health=$$health"
            fi

            if [ -n "$$started" ] && [ "$$started" != "$$last_started" ]; then
              echo "myst-netns-watchdog: observed myst-client started_at=$$started health=$$health"
              last_started="$$started"
            fi

            if [ -n "$$started" ] && [ "$$started" != "$$applied_started" ]; then
              if [ "$$health" != "healthy" ]; then
                echo "myst-netns-watchdog: waiting for myst-client healthy before restarting dependents (started_at=$$started health=$$health)"
              else
                echo "myst-netns-watchdog: myst-client healthy for started_at=$$started; restarting shared-netns services"
                for cid in $$(docker ps -q \
                  --filter label=com.docker.compose.project=$${COMPOSE_PROJECT_NAME} \
                  --filter label=netns-shared-myst=true); do
                  svc="$$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$$cid" 2>/dev/null || true)"
                  if [ "$$svc" = "myst-client" ]; then
                    continue
                  fi
                  echo "myst-netns-watchdog: restarting $$svc ($$cid)"
                  docker restart "$$cid" >/dev/null || true
                done
                applied_started="$$started"
              fi
            fi
          fi

          sleep "$${MYST_NETNS_WATCH_INTERVAL}"
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      myst-client:
        condition: service_started

  # Onyx app tier (routed through the shared myst-client-vpn namespace)
  api_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: api_server
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:myst-client"
    environment:
      # Generate with: openssl rand -hex 32
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:-CHANGE_ME_DEV_ONLY_SET_A_LONG_RANDOM_SECRET}
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      # Controls Web connector SSRF-style URL checks. Empty disables checks;
      # non-empty enables global-IP validation (blocks localhost/private IPs).
      WEB_CONNECTOR_VALIDATE_URLS: ${WEB_CONNECTOR_VALIDATE_URLS:-}
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    depends_on:
      myst-client:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - api_server_logs:/var/log/onyx

  background:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: background
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:myst-client"
    environment:
      # Generate with: openssl rand -hex 32
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:-CHANGE_ME_DEV_ONLY_SET_A_LONG_RANDOM_SECRET}
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_CELERY_TRACES_SAMPLE_RATE: "0"
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      # Controls Web connector SSRF-style URL checks. Empty disables checks;
      # non-empty enables global-IP validation (blocks localhost/private IPs).
      WEB_CONNECTOR_VALIDATE_URLS: ${WEB_CONNECTOR_VALIDATE_URLS:-}
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    depends_on:
      myst-client:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - background_logs:/var/log/onyx

  web_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: web_server
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    image: onyxdotapp/onyx-web-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:myst-client"
    environment:
      # Disable frontend analytics/instrumentation and cloud billing flows.
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    # In shared netns mode, Next.js may bind eth0 only (not loopback), so
    # healthcheck probes the namespace IP instead of 127.0.0.1.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ip=$$(hostname -i | awk '{print $1}'); wget -q -T 5 -O /dev/null http://$$ip:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      myst-client:
        condition: service_healthy

  nginx:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: nginx
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    network_mode: "service:myst-client"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports: !reset []
    depends_on:
      myst-client:
        condition: service_healthy

  code-interpreter:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: code-interpreter
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    #image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:?CODE_INTERPRETER_IMAGE_TAG must be set}
    image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:?CODE_INTERPRETER_IMAGE_TAG must be set}
    network_mode: "service:myst-client"
    depends_on:
      myst-client:
        condition: service_healthy

  teep:
    image: ${TEEP_IMAGE:-13rac1/teep:main}
    restart: unless-stopped
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    network_mode: "service:myst-client"
    environment:
      TEEP_LISTEN_ADDR: "${TEEP_LISTEN_ADDR:-127.0.0.1:8337}"
      TEEP_SERVE_FLAGS: "${TEEP_SERVE_FLAGS:-}"
      VENICE_API_KEY: "${VENICE_API_KEY:-}"
      NEARAI_API_KEY: "${NEARAI_API_KEY:-}"
      CHUTES_API_KEY: "${CHUTES_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8337/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      myst-client:
        condition: service_healthy

  # Read-only HTTP view of DOC_DROP_DIR from inside the shared myst namespace.
  # Use with Onyx Web connector at http://localhost:${DOC_DROP_WEB_PORT:-8091}/
  # so source links stay host-clickable while crawler access remains local.
  doc-drop-web:
    image: python:3.12-alpine
    restart: unless-stopped
    labels:
      autoheal: "true"
      netns-shared-myst: "true"
    network_mode: "service:myst-client"
    volumes:
      - ${DOC_DROP_DIR:-./doc-drop}:/import/docs:ro
    command:
      - python
      - -m
      - http.server
      - ${DOC_DROP_WEB_CONTAINER_PORT:-8091}
      - --bind
      - 0.0.0.0
      - --directory
      - /import/docs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:${DOC_DROP_WEB_CONTAINER_PORT:-8091}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      myst-client:
        condition: service_healthy

  # Onyx internal/data services (remain on compose network)
  inference_model_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: inference_model_server
    image: onyxdotapp/onyx-model-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    environment:
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./docker-data/model-cache:/app/.cache/huggingface
      - inference_model_server_logs:/var/log/onyx

  indexing_model_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: indexing_model_server
    image: onyxdotapp/onyx-model-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    environment:
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./docker-data/indexing-model-cache:/app/.cache/huggingface
      - indexing_model_server_logs:/var/log/onyx

  relational_db:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: relational_db
    volumes: !override
      - ./docker-data/postgres:/var/lib/postgresql/data

  opensearch:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: opensearch
    volumes: !override
      - ./docker-data/opensearch:/usr/share/opensearch/data

  cache:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: cache

  # Required by upstream Onyx service dependencies inherited via extends.
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:


