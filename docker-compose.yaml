## Wrapper stack for sharing one Mysterium VPN namespace across SearxNG + Onyx.
##
## Use .env.wrapper for wrapper-specific image tags and host port mappings.
## Preferred entrypoints:
##   make up       (default lite mode)
##   make up-full  (full mode)

services:
  # VPN gateway for SearxNG-routed workloads
  myst-client:
    extends:
      file: ./myst/docker-compose.yaml
      service: myst-client
    # Keep myst-client internal-only. Host port publishing is handled by
    # dedicated bridge proxies below so host access remains stable even when
    # VPN routing is active in this namespace.
    ports: []
    networks:
      default:
        aliases:
          - api_server
          - web_server
          - background
          - nginx
          - code-interpreter
    volumes: !override
      - ./docker-data/myst-data:/var/lib/mysterium-node
      - ./docker-data/myst-data:/root/.mysterium

  searxng-core:
    extends:
      file: ./searxng/docker-compose.yml
      service: core
    environment:
      SEARXNG_PORT: ${SEARXNG_CONTAINER_PORT:-8888}
    network_mode: "service:myst-client"
    volumes: !override
      - ./searxng/core-config/:/etc/searxng/:Z
      - ./docker-data/searxng-cache:/var/cache/searxng
    depends_on:
      myst-client:
        condition: service_healthy

  searxng-valkey:
    extends:
      file: ./searxng/docker-compose.yml
      service: valkey
    volumes: !override
      - ./docker-data/valkey:/data

  # Host-facing TCP bridges. These run on the normal compose network and
  # forward host traffic to services inside the myst-client namespace.
  host-web-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:3000,fork,reuseaddr tcp-connect:myst-client:80
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      myst-client:
        condition: service_started

  host-searxng-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${SEARXNG_CONTAINER_PORT:-8888},fork,reuseaddr tcp-connect:myst-client:${SEARXNG_CONTAINER_PORT:-8888}
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_CONTAINER_PORT:-8888}
    depends_on:
      myst-client:
        condition: service_started

  # Onyx app tier (routed through the shared myst-client-vpn namespace)
  api_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: api_server
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:-v3.2.4}}
    build: !reset null
    network_mode: "service:myst-client"
    environment:
      # Generate with: openssl rand -hex 32
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:-CHANGE_ME_DEV_ONLY_SET_A_LONG_RANDOM_SECRET}
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    depends_on:
      myst-client:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - api_server_logs:/var/log/onyx

  background:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: background
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:-v3.2.4}}
    build: !reset null
    network_mode: "service:myst-client"
    environment:
      # Generate with: openssl rand -hex 32
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:-CHANGE_ME_DEV_ONLY_SET_A_LONG_RANDOM_SECRET}
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    depends_on:
      myst-client:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - background_logs:/var/log/onyx

  web_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: web_server
    image: ${ONYX_WEB_SERVER_IMAGE:-onyxdotapp/onyx-web-server:${ONYX_IMAGE_TAG:-v3.2.4}}
    build: !reset null
    network_mode: "service:myst-client"
    environment:
      # Disable frontend analytics/instrumentation and cloud billing flows.
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    depends_on:
      myst-client:
        condition: service_healthy

  nginx:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: nginx
    network_mode: "service:myst-client"
    ports: !reset []
    depends_on:
      myst-client:
        condition: service_healthy

  code-interpreter:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: code-interpreter
    #image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:-v3.2.4}
    image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:-latest}
    network_mode: "service:myst-client"
    depends_on:
      myst-client:
        condition: service_healthy

  # Onyx internal/data services (remain on compose network)
  inference_model_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: inference_model_server
    image: ${ONYX_MODEL_SERVER_IMAGE:-onyxdotapp/onyx-model-server:${ONYX_IMAGE_TAG:-v3.2.4}}
    build: !reset null
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./docker-data/model-cache:/app/.cache/huggingface
      - inference_model_server_logs:/var/log/onyx

  indexing_model_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: indexing_model_server
    image: ${ONYX_MODEL_SERVER_IMAGE:-onyxdotapp/onyx-model-server:${ONYX_IMAGE_TAG:-v3.2.4}}
    build: !reset null
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./docker-data/indexing-model-cache:/app/.cache/huggingface
      - indexing_model_server_logs:/var/log/onyx

  relational_db:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: relational_db
    volumes: !override
      - ./docker-data/postgres:/var/lib/postgresql/data

  index:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: index
    volumes: !override
      - ./docker-data/vespa:/opt/vespa/var

  opensearch:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: opensearch
    volumes: !override
      - ./docker-data/opensearch:/usr/share/opensearch/data

  cache:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: cache

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:


