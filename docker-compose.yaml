## Private Onyx wrapper with a trusted Mysterium routing namespace and
## restricted request-path component networks.
##
## Use stack.versions.env for image tags/source refs and .env.wrapper for
## local runtime configuration such as host ports, routing, and credentials.
## Preferred entrypoints:
##   make up       (default lite mode)
##   make up-full  (full mode)

name: onyx

x-tcp-gateway: &tcp-gateway
  image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
  restart: unless-stopped
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  sysctls:
    net.ipv4.ip_forward: "0"
    net.ipv6.conf.all.forwarding: "0"

x-policy-proxy: &policy-proxy
  image: ${PYTHON_SLIM_IMAGE:?PYTHON_SLIM_IMAGE must be set}
  restart: unless-stopped
  network_mode: "service:netns-holder"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./crw/prefetch_blocking_proxy.py:/app/prefetch_blocking_proxy.py:ro
  command: ["python", "-u", "/app/prefetch_blocking_proxy.py"]
  healthcheck:
    test: ["CMD", "python", "/app/prefetch_blocking_proxy.py", "--check-ready"]
    interval: 30s
    timeout: 20s
    retries: 3
    start_period: 10s

services:
  # Stable owner for the shared network namespace.
  # All VPN-routed services join this namespace so myst-client can restart
  # without invalidating other containers' network namespace references.
  netns-holder:
    image: ${NETNS_HOLDER_IMAGE:?NETNS_HOLDER_IMAGE must be set}
    command: ["sleep", "infinity"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      routing-uplink:
        aliases: [myst-client]
        gw_priority: 1
      prefetch-policy-upstream:
        aliases: [myst-client]
      browser-policy-upstream:
        aliases: [myst-client]
      onyx-public-broker:
        aliases: [onyx-public-route-broker]
      onyx-host-broker:
        aliases: [onyx-host-route-broker]

  # VPN gateway for SearxNG-routed workloads
  myst-client:
    extends:
      file: ./myst/docker-compose.yaml
      service: myst-client
    labels:
      autoheal: "true"
    # Join the stable namespace owned by netns-holder.
    network_mode: "service:netns-holder"
    # Keep myst-client internal-only. Host port publishing is handled by
    # dedicated bridge proxies below so host access remains stable even when
    # VPN routing is active in this namespace.
    ports: []
    environment:
      # WireGuard MTU override to fix HTTPS timeouts on path MTU constraints
      # Set to 1280 to work around ISP upstream path MTU constraints
      MYST_VPN_WIREGUARD_MTU: "${MYST_VPN_WIREGUARD_MTU:-1280}"
      # Master VPN switch. When "false", myst-client idles the daemon without
      # arming the kill-switch or connecting. See .env.wrapper.example.
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
    depends_on:
      netns-holder:
        condition: service_started

  searxng-core:
    extends:
      file: ./searxng/docker-compose.yml
      service: core
    environment:
      SEARXNG_PORT: "8888"
      # Generated by the Makefile for each stack start.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      # Self-hosted crw runs open by default; this is only a non-empty bearer
      # placeholder for SearXNG's crw-backed stub engines.
      CRW_ONYX_API_KEY: ${CRW_ONYX_API_KEY:?CRW_ONYX_API_KEY must be set}
      # Use one configured CRW-backed web provider per search query. Last-resort
      # providers such as bing2 are selected only when normal providers are
      # already suspended or unavailable.
      SEARXNG_ROUND_ROBIN: "${SEARXNG_ROUND_ROBIN:-true}"
      CRW_SCRAPE_URL: "http://crw:3010/v1/scrape"
      WRAPPER_PATCH_STRICT: "true"
      PYTHONPATH: "/usr/local/searxng/wrapper-patches:${PYTHONPATH:-}"
      # Page load waiting is handled by the CDP shim's waitUntil injection
      # (the wrapper example uses load for SERPs and domcontentloaded for web
      # pages), not by a CRW
      # waitFor sleep. See docs/request_handling.md §1.6 for the full
      # wait strategy.
    networks: [searxng-api, crw-search, searxng-valkey]
    volumes: !override
      - ./searxng/core-config/:/etc/searxng/:Z
      - ./docker-data/searxng-cache:/var/cache/searxng
      - ./searxng/patches:/usr/local/searxng/wrapper-patches:ro
      # crw + obscura stealth-browser backed stub engines. Mounted as
      # individual files (not the whole dir) so the image's built-in engines
      # are preserved. Loaded by SearXNG via the `engine:` field in
      # settings.yml -- no image rebuild needed. See searxng/engines/_crw.py.
      - ./searxng/engines/_crw.py:/usr/local/searxng/searx/engines/_crw.py:ro
      - ./searxng/engines/google2.py:/usr/local/searxng/searx/engines/google2.py:ro
      - ./searxng/engines/brave2.py:/usr/local/searxng/searx/engines/brave2.py:ro
      - ./searxng/engines/duckduckgo2.py:/usr/local/searxng/searx/engines/duckduckgo2.py:ro
      - ./searxng/engines/startpage2.py:/usr/local/searxng/searx/engines/startpage2.py:ro
      - ./searxng/engines/bing2.py:/usr/local/searxng/searx/engines/bing2.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      searxng-valkey:
        condition: service_healthy

  searxng-valkey:
    extends:
      file: ./searxng/docker-compose.yml
      service: valkey
    volumes: !override
      - ./docker-data/valkey:/data
    networks: [searxng-valkey]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── fastCRW (crw) + obscura stealth CDP browser ─────────────────────────
  # Self-hosted CRW scraper (available in both lite and full mode), routed
  # through Myst. This stack points Onyx's Firecrawl content-provider setting
  # and the CRW-backed SearXNG engines at CRW's native /v1/scrape endpoint.
  #
  # The JS renderer tier is obscura (a Rust-native headless browser with
  # built-in stealth), replacing crw's upstream browserless/chrome-stealth
  # profile. obscura exposes a CDP WebSocket on port 9222 that crw drives via
  # its `cdp` cargo feature. These services use narrow internal networks and
  # send egress through policy bridges in the trusted routing namespace.
  #
  # Both images are pulled from their upstream registries (no local builds):
  #   - obscura: h4ckf0r0day/obscura (release builds include the stealth feature)
  #   - crw:     ghcr.io/us/crw (built with --features cdp upstream)
  # crw is configured entirely via CRW_* env vars (Figment env layer has the
  # highest precedence — see crates/crw-core/src/config.rs AppConfig::load).

  # Stealth headless browser: serves a Chrome DevTools Protocol WebSocket.
  # Release binaries include the stealth feature, so --stealth at runtime
  # enables the full anti-fingerprint + tracker-blocking domain.
  # crw connects to ws://obscura:9222/devtools/browser.
  obscura:
    image: ${OBSCURA_IMAGE:?OBSCURA_IMAGE must be set}
    restart: unless-stopped
    networks: [obscura-control, browser-egress]
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9222"
      - "--stealth"
      # Persist cookies to /data/obscura so they survive container restarts
      # and are reloaded on BrowserContext creation (obscura's context.rs
      # loads {storage_dir}/cookies.json on init, saves on shutdown). This
      # gives obscura's own BrowserContext cookie continuity across restarts.
      # NOTE: CRW drives obscura via CDP Target.createBrowserContext, which
      # bypasses obscura's Rust BrowserContext API — so this storage_dir
      # does NOT give CRW's per-request CDP contexts cookie persistence.
      # It only helps obscura's MCP/CLI paths. CRW cookie carry-over would
      # require a code change to CRW's cdp.rs (Network.getCookies/setCookies
      # around the per-request context create/dispose cycle).
      - "--storage-dir"
      - "/data/obscura"
    environment:
      # Hard ceiling on a single Page.navigate. Obscura's default is 30s,
      # but when EGRESS_UPSTREAM_PROXY_URL routes through Tor or a slow VPN, page loads can
      # take up to 60s. Set to 45000 to give obscura enough headroom for
      # the waitUntil=networkidle2 condition (injected by the CDP shim) to
      # resolve on slow proxy paths. Must be ≤ CRW's chrome_timeout_ms
      # (CRW_RENDERER__CHROME_TIMEOUT_MS below) so CRW's outer deadline
      # doesn't fire before obscura's nav timeout.
      OBSCURA_NAV_TIMEOUT_MS: "${OBSCURA_NAV_TIMEOUT_MS:-45000}"
      # Per-CDP-command deadline. A hung page (runaway Runtime.evaluate,
      # synchronous DOM op) is terminated after this budget so one bad
      # session cannot hold the shared V8 lock and stall others. Default
      # 60s; set to 90000 to accommodate slow Tor page renders.
      OBSCURA_CDP_COMMAND_TIMEOUT_MS: "${OBSCURA_CDP_COMMAND_TIMEOUT_MS:-90000}"
      # Request timeout for scripted fetch()/XHR/ES-module loads. Default
      # 30s; bump to 45000 for slow proxy paths.
      OBSCURA_FETCH_TIMEOUT_MS: "${OBSCURA_FETCH_TIMEOUT_MS:-45000}"
      # Obscura's reqwest SSRF resolver also validates the configured proxy
      # hostname. Permit its private Docker address so requests can reach the
      # mandatory egress bridge. The browser remains confined to internal
      # networks, and the final-hop browser policy performs authoritative
      # destination DNS resolution and private-address rejection.
      OBSCURA_ALLOW_PRIVATE_NETWORK: "true"
      OBSCURA_PROXY: "http://obscura-egress-bridge:3128"
    volumes:
      - obscura-data:/data/obscura
    healthcheck:
      # The obscura image is distroless (no shell, no wget/curl), so the
      # healthcheck uses the obscura binary's own `fetch` subcommand against
      # the /json/version HTTP endpoint. --dump original bypasses the JS/DOM
      # layer (raw response body); --allow-private-network permits loopback;
      # --proxy "" overrides the inherited OBSCURA_PROXY for this local-only
      # probe; --quiet suppresses the banner. /json/version is served on the
      # dedicated accept thread (issue #62) so it stays responsive even while
      # V8 JS evaluation blocks the LocalSet.
      test: ["CMD", "/obscura", "fetch", "http://127.0.0.1:9222/json/version", "--dump", "original", "--proxy", "", "--allow-private-network", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      obscura-egress-bridge:
        condition: service_healthy

  # CDP WebSocket proxy shim between CRW and obscura.
  #
  # Sits on port 9224 between CRW and obscura (port 9222) to provide:
  #
  # 1. waitUntil injection — CRW sends Page.navigate without waitUntil.
  #    Obscura's CDP default is domcontentloaded, which can return too early for
  #    JS-heavy SERPs. The shim injects the configured per-URL lifecycle wait;
  #    the wrapper example uses load for search and domcontentloaded for web.
  #
  # 2. STEALTH_JS stripping — CRW unconditionally injects its own stealth
  #    script via Page.addScriptToEvaluateOnNewDocument with Mac-specific
  #    WebGL strings that conflict with obscura's Linux platform. The shim
  #    replaces the script source with a no-op, letting obscura's own
  #    --stealth mode handle fingerprinting without conflict.
  #
  # 3. proxyServer stripping safety net — if CRW is ever configured with a
  #    crawler proxy that creates a per-request CDP browser context, the shim
  #    strips proxyServer so browser traffic uses obscura's own --proxy path.
  #
  # CRW connects to ws://cdp-shim:9224/devtools/browser on the dedicated CDP
  # network; the shim reaches ws://obscura:9222 on the control network. It
  # proxies all CDP traffic transparently except for the intercepted methods.
  #
  # See crw/cdp_shim.py for the implementation. No build step — the script is
  # bind-mounted into a stock python:3.12-slim image and deps are pip-installed
  # at container start (same pattern as onyx/local_embedding_shim.py in
  # docker-compose.full.yml).
  cdp-shim:
    image: ${CDP_SHIM_IMAGE:?CDP_SHIM_IMAGE must be set}
    restart: unless-stopped
    networks: [crw-cdp, obscura-control]
    environment:
      CDP_SHIM_HOST: "0.0.0.0"
      CDP_SHIM_PORT: "9224"
      OBSCURA_CDP_URL: "ws://obscura:9222/devtools/browser"
      # Strip CRW's STEALTH_JS (1 = yes, 0 = no).
      CDP_SHIM_STRIP_STEALTH_JS: "1"
      CDP_SHIM_LOG_LEVEL: "info"
      # Per-URL waitUntil injection into Page.navigate calls.
      # The wrapper example uses load for search URLs and domcontentloaded for
      # other URLs that CRW escalates to CDP. Operators can select networkidle
      # modes for providers that need them. Usable non-search HTTP-prefetch
      # results can return before CDP.
      #
      # Obscura lifecycle event firing order (each implies the previous):
      #   1. domcontentloaded  — DOM parsed + scripts executed
      #   2. load              — all subresources finished, onload fired
      #   3. networkidle2      — ≤2 active network requests for 500ms
      #   4. networkidle0     — 0 active network requests for 500ms
      OBSCURA_BROWSER_WAIT_UNTIL_SEARCH: "${OBSCURA_BROWSER_WAIT_UNTIL_SEARCH:-networkidle2}"
      OBSCURA_BROWSER_WAIT_UNTIL_WEB: "${OBSCURA_BROWSER_WAIT_UNTIL_WEB:-load}"
      OBSCURA_BROWSER_WAIT_UNTIL_SEARCH_HOSTS: "google.com,search.brave.com,html.duckduckgo.com,startpage.com,bing.com"
      # Fail closed for cleartext HTTP browser navigations. The prefetch proxy
      # enforces the same setting before CRW can fetch http:// URLs directly.
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      # Interval for periodic cookie clearing on obscura (seconds). In the
      # normal wrapper path CRW uses Target.createTarget on obscura's default
      # context, so cookies can persist between CDP WebSocket connections.
      # If a per-request Target.createBrowserContext path is introduced,
      # Obscura clears the default jar on context create/dispose. Default: 3600
      # (60 min). Set to 0 to disable.
      OBSCURA_BROWSER_CLEAR_COOKIES_INTERVAL: "${OBSCURA_BROWSER_CLEAR_COOKIES_INTERVAL:-3600}"
      # Optional sanitized CDP lifecycle/network trace for short debugging
      # sessions. Query values are redacted by default; see
      # docs/request_handling.md for the trace-specific controls.
      CDP_SHIM_TRACE: "${CDP_SHIM_TRACE:-0}"
      CDP_SHIM_TRACE_INCLUDE_QUERY_VALUES: "${CDP_SHIM_TRACE_INCLUDE_QUERY_VALUES:-0}"
      CDP_SHIM_TRACE_SAFE_QUERY_KEYS: "${CDP_SHIM_TRACE_SAFE_QUERY_KEYS:-udm,hl,gl,start,tbs,safe,filter}"
    volumes:
      - ./crw/cdp_shim.py:/app/cdp_shim.py:ro
    # Dependencies are installed from the hashed lock while building the
    # image. Runtime starts offline on internal-only networks.
    command: ["python", "-u", "/app/cdp_shim.py"]
    healthcheck:
      # The shim is a Python websockets server. Use a raw TCP connect to
      # check the port is listening. The websockets library will log a 400
      # for this (it's not a valid WebSocket handshake), but that's harmless
      # — the shim suppresses the log for connections that don't send a
      # valid HTTP upgrade.
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 9224)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      obscura:
        condition: service_healthy

  # Prefetch-blocking HTTP proxy for CRW.
  #
  # CRW unconditionally sends a bare reqwest GET (non-browser TLS fingerprint,
  # no JS) to every target URL before escalating to obscura's stealth CDP
  # browser. For anti-bot-protected search engines, this double-hit from the
  # same IP — first with a non-browser TLS fingerprint — is a strong bot
  # detection signal and a primary cause of 429s.
  #
  # This proxy intercepts CRW's HTTP prefetch requests:
  #  - Search engine URLs → 403 immediately (no network request)
  #  - Internal/private targets → 403 immediately
  #  - Other plain HTTP URLs → 403 unless EGRESS_ALLOW_HTTP_URLS=true
  #  - Other HTTPS URLs → CONNECT tunnel through the configured egress path
  #
  # CRW points HTTP_PROXY/HTTPS_PROXY at a narrow bridge to this proxy. We
  # intentionally do not set CRW_CRAWLER__PROXY; if that path is used later,
  # the CDP shim strips proxyServer from Target.createBrowserContext so
  # obscura uses its own --proxy flag, not this proxy.
  #
  # When EGRESS_UPSTREAM_PROXY_URL is set (e.g., Tor SOCKS proxy), this
  # proxy routes its own upstream requests through that proxy. It also blocks
  # internal/private destinations without opening CONNECT or HTTP forwarding
  # paths; target DNS resolution checks are performed only when no explicit
  # upstream proxy is configured.
  #
  # See crw/prefetch_blocking_proxy.py for the implementation and
  # docs/request_handling.md §1.7 for the design.
  prefetch-blocking-proxy:
    image: ${PYTHON_SLIM_IMAGE:?PYTHON_SLIM_IMAGE must be set}
    restart: unless-stopped
    network_mode: "service:netns-holder"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PREFETCH_PROXY_HOST: "0.0.0.0"
      PREFETCH_PROXY_PORT: "3128"
      PREFETCH_PROXY_LOG_LEVEL: "${PREFETCH_PROXY_LOG_LEVEL:-info}"
      EGRESS_PROXY_POLICY: prefetch
      EGRESS_PROXY_ALLOWED_CLIENT_HOSTS: crw-prefetch-bridge
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
      # Upstream proxy (EGRESS_UPSTREAM_PROXY_URL from .env.wrapper). When set, the proxy
      # routes its own upstream requests through this upstream.
      # Supports http://, https://, socks5://, socks5h://
      EGRESS_UPSTREAM_PROXY_URL: "${EGRESS_UPSTREAM_PROXY_URL:-}"
      ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13: "${ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13:-true}"
      # Cleartext http:// URL policy. The CDP shim enforces the same setting
      # for browser navigations after CRW escalates to Obscura.
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      # Comma-separated list of search engine hostnames to block immediately
      # (return 403 without any network request).
      PREFETCH_BLOCK_HOSTS: "${PREFETCH_BLOCK_HOSTS:-google.com,search.brave.com,html.duckduckgo.com,startpage.com,bing.com}"
      PREFETCH_BLOCK_INTERNAL_HOSTS: "${PREFETCH_BLOCK_INTERNAL_HOSTS:-}"
    volumes:
      - ./crw/prefetch_blocking_proxy.py:/app/prefetch_blocking_proxy.py:ro
    command:
      - /bin/sh
      - -c
      - |
        exec python -u /app/prefetch_blocking_proxy.py
    healthcheck:
      test: ["CMD", "python", "/app/prefetch_blocking_proxy.py", "--check-ready"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  # Search-allowed browser policy instances. Both remain in the trusted
  # routing namespace; restricted browser processes reach them only through
  # dedicated bridges.
  browser-egress-proxy:
    <<: *policy-proxy
    environment:
      PREFETCH_PROXY_HOST: "0.0.0.0"
      PREFETCH_PROXY_PORT: "3130"
      EGRESS_PROXY_POLICY: browser
      EGRESS_PROXY_ALLOWED_CLIENT_HOSTS: obscura-egress-bridge
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
      PREFETCH_PROXY_LOG_LEVEL: "${PREFETCH_PROXY_LOG_LEVEL:-info}"
      EGRESS_UPSTREAM_PROXY_URL: "${EGRESS_UPSTREAM_PROXY_URL:-}"
      ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13: "${ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13:-true}"
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      PREFETCH_BLOCK_HOSTS: "${PREFETCH_BLOCK_HOSTS:-google.com,search.brave.com,html.duckduckgo.com,startpage.com,bing.com}"
      PREFETCH_BLOCK_INTERNAL_HOSTS: "${PREFETCH_BLOCK_INTERNAL_HOSTS:-}"
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  # Authoritative final connections remain in the trusted routing namespace.
  # These are authenticated stream brokers, not HTTP/SOCKS proxies.
  onyx-public-route-broker:
    image: ${PYTHON_SLIM_IMAGE:?PYTHON_SLIM_IMAGE must be set}
    restart: unless-stopped
    network_mode: "service:netns-holder"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EGRESS_BROKER_HOST: onyx-public-route-broker
      EGRESS_BROKER_PORT: "3140"
      EGRESS_BROKER_ALLOWED_CLIENT_HOST: onyx-public-egress-policy
      EGRESS_ROUTE_BROKER_CREDENTIAL: "${ONYX_PUBLIC_ROUTE_BROKER_CREDENTIAL:?ONYX_PUBLIC_ROUTE_BROKER_CREDENTIAL must be set}"
      EGRESS_ROUTE_CLASS: public
      EGRESS_ALLOW_RFC1918: "false"
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
      EGRESS_UPSTREAM_PROXY_URL: "${EGRESS_UPSTREAM_PROXY_URL:-}"
      ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13: "${ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13:-true}"
      PREFETCH_BLOCK_INTERNAL_HOSTS: "${PREFETCH_BLOCK_INTERNAL_HOSTS:-}"
    volumes:
      - ./crw/prefetch_blocking_proxy.py:/app/prefetch_blocking_proxy.py:ro
      - ./crw/route_broker.py:/app/route_broker.py:ro
    command: ["python", "-u", "/app/route_broker.py"]
    healthcheck:
      test: ["CMD", "python", "/app/route_broker.py", "--check-ready"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    depends_on:
      myst-client: {condition: service_healthy}

  onyx-host-route-broker:
    extends: onyx-public-route-broker
    environment:
      EGRESS_BROKER_HOST: onyx-host-route-broker
      EGRESS_BROKER_PORT: "3141"
      EGRESS_BROKER_ALLOWED_CLIENT_HOST: onyx-host-egress-policy
      EGRESS_ROUTE_BROKER_CREDENTIAL: "${ONYX_HOST_ROUTE_BROKER_CREDENTIAL:?ONYX_HOST_ROUTE_BROKER_CREDENTIAL must be set}"
      EGRESS_ROUTE_CLASS: host
      EGRESS_PROXY_POLICY: onyx-helper
      EGRESS_PROXY_TRUSTED_INTERNAL_DESTINATIONS: "doc-drop-web:8091"
      EGRESS_ALLOW_RFC1918: "${EGRESS_ALLOW_RFC1918:-false}"
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
      EGRESS_UPSTREAM_PROXY_URL: "${EGRESS_UPSTREAM_PROXY_URL:-}"
      ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13: "${ONYX_AGENT_HTTPS_PROXY_REQUIRE_TLS13:-true}"
      PREFETCH_BLOCK_INTERNAL_HOSTS: "${PREFETCH_BLOCK_INTERNAL_HOSTS:-}"

  # Separate policy namespaces preserve the public/host security boundary.
  onyx-public-egress-policy:
    image: ${PYTHON_SLIM_IMAGE:?PYTHON_SLIM_IMAGE must be set}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks: [onyx-public-policy-upstream, onyx-public-broker]
    environment:
      PREFETCH_PROXY_HOST: "0.0.0.0"
      PREFETCH_PROXY_PORT: "3128"
      EGRESS_PROXY_POLICY: onyx-helper
      EGRESS_PROXY_ALLOWED_CLIENT_HOSTS: onyx-public-egress-bridge
      EGRESS_ROUTE_CLASS: public
      EGRESS_POLICY_DEFER_DNS: "true"
      EGRESS_ROUTE_BROKER_HOST: onyx-public-route-broker
      EGRESS_ROUTE_BROKER_PORT: "3140"
      EGRESS_ROUTE_BROKER_CREDENTIAL: "${ONYX_PUBLIC_ROUTE_BROKER_CREDENTIAL:?ONYX_PUBLIC_ROUTE_BROKER_CREDENTIAL must be set}"
      MYST_VPN_ENABLED: "false"
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      PREFETCH_BLOCK_INTERNAL_HOSTS: "${PREFETCH_BLOCK_INTERNAL_HOSTS:-}"
    volumes:
      - ./crw/prefetch_blocking_proxy.py:/app/prefetch_blocking_proxy.py:ro
    command: ["python", "-u", "/app/prefetch_blocking_proxy.py"]
    healthcheck:
      test: ["CMD", "python", "/app/prefetch_blocking_proxy.py", "--check-ready"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    depends_on:
      onyx-public-route-broker: {condition: service_healthy}

  onyx-host-egress-policy:
    extends: onyx-public-egress-policy
    networks: !override [onyx-host-policy-upstream, onyx-host-broker]
    environment:
      PREFETCH_PROXY_HOST: "0.0.0.0"
      PREFETCH_PROXY_PORT: "3128"
      EGRESS_PROXY_POLICY: onyx-helper
      EGRESS_PROXY_ALLOWED_CLIENT_HOSTS: onyx-host-egress-bridge
      EGRESS_ROUTE_CLASS: host
      EGRESS_PROXY_TRUSTED_INTERNAL_DESTINATIONS: "doc-drop-web:8091"
      EGRESS_POLICY_DEFER_DNS: "true"
      EGRESS_ROUTE_BROKER_HOST: onyx-host-route-broker
      EGRESS_ROUTE_BROKER_PORT: "3141"
      EGRESS_ROUTE_BROKER_CREDENTIAL: "${ONYX_HOST_ROUTE_BROKER_CREDENTIAL:?ONYX_HOST_ROUTE_BROKER_CREDENTIAL must be set}"
      EGRESS_ALLOW_RFC1918: "${EGRESS_ALLOW_RFC1918:-false}"
      MYST_VPN_ENABLED: "false"
      EGRESS_ALLOW_HTTP_URLS: "${EGRESS_ALLOW_HTTP_URLS:-false}"
      PREFETCH_BLOCK_INTERNAL_HOSTS: "${PREFETCH_BLOCK_INTERNAL_HOSTS:-}"
    depends_on: !override
      onyx-host-route-broker: {condition: service_healthy}

  crw-prefetch-bridge:
    <<: *tcp-gateway
    command: ["tcp-listen:3128,fork,reuseaddr", "tcp-connect:myst-client:3128"]
    networks: [crw-prefetch-egress, prefetch-policy-upstream]
    depends_on:
      prefetch-blocking-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'CONNECT localhost:443 HTTP/1.1\r\nHost: localhost:443\r\n\r\n' | socat -T 3 STDIO,ignoreeof TCP:127.0.0.1:3128,connect-timeout=3 | grep -q '^HTTP/1.1 403'"]
      interval: 30s
      timeout: 5s
      retries: 3

  obscura-egress-bridge:
    <<: *tcp-gateway
    command: ["tcp-listen:3128,fork,reuseaddr", "tcp-connect:myst-client:3130"]
    networks: [browser-egress, browser-policy-upstream]
    depends_on:
      browser-egress-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'CONNECT localhost:443 HTTP/1.1\r\nHost: localhost:443\r\n\r\n' | socat -T 3 STDIO,ignoreeof TCP:127.0.0.1:3128,connect-timeout=3 | grep -q '^HTTP/1.1 403'"]
      interval: 30s
      timeout: 5s
      retries: 3

  onyx-public-egress-bridge:
    <<: *tcp-gateway
    command: ["tcp-listen:3128,fork,reuseaddr", "tcp-connect:onyx-public-egress-policy:3128"]
    networks: [onyx-public-egress, onyx-public-policy-upstream]
    depends_on:
      onyx-public-egress-policy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'CONNECT localhost:443 HTTP/1.1\r\nHost: localhost:443\r\n\r\n' | socat -T 3 STDIO,ignoreeof TCP:127.0.0.1:3128,connect-timeout=3 | grep -q '^HTTP/1.1 403'"]
      interval: 30s
      timeout: 5s
      retries: 3

  onyx-host-egress-bridge:
    <<: *tcp-gateway
    command: ["tcp-listen:3128,fork,reuseaddr", "tcp-connect:onyx-host-egress-policy:3128"]
    networks: [onyx-host-egress, onyx-host-policy-upstream]
    depends_on:
      onyx-host-egress-policy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'CONNECT localhost:443 HTTP/1.1\r\nHost: localhost:443\r\n\r\n' | socat -T 3 STDIO,ignoreeof TCP:127.0.0.1:3128,connect-timeout=3 | grep -q '^HTTP/1.1 403'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Narrow service ingress gateways from trusted Onyx callers to restricted
  # request-path services.
  crw-service-gateway:
    <<: *tcp-gateway
    command: ["tcp-listen:3010,fork,reuseaddr", "tcp-connect:crw:3010"]
    networks: [onyx-backend, crw-api]
    depends_on:
      crw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /health HTTP/1.1\r\nHost: crw\r\nConnection: close\r\n\r\n' | socat -T 5 STDIO,ignoreeof TCP:127.0.0.1:3010,connect-timeout=5 | grep -Eq '^HTTP/1[.][01] 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # CRW 0.23 performs a local DNS lookup as URL-safety prevalidation before
  # sending its actual request through HTTP_PROXY/HTTPS_PROXY. This
  # loopback-only resolver shares CRW's otherwise internal-only network
  # namespace and returns a synthetic global A record without forwarding the
  # browsing hostname. Docker still answers known service names first, so CRW
  # sees their real private addresses and rejects them. The final-hop policy
  # proxy performs authoritative target DNS and destination validation.
  crw-validation-dns:
    image: ${PYTHON_ALPINE_IMAGE:?PYTHON_ALPINE_IMAGE must be set}
    restart: unless-stopped
    network_mode: "service:crw"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./crw/validation_dns.py:/app/validation_dns.py:ro
    command: ["python", "-u", "/app/validation_dns.py"]
    healthcheck:
      test: ["CMD", "python", "/app/validation_dns.py", "--check-ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      crw:
        condition: service_started
        restart: true

  searxng-service-gateway:
    <<: *tcp-gateway
    command: ["tcp-listen:8888,fork,reuseaddr", "tcp-connect:searxng-core:8888"]
    networks: [onyx-backend, searxng-api]
    depends_on:
      searxng-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.1\r\nHost: searxng\r\nConnection: close\r\n\r\n' | socat -T 5 STDIO,ignoreeof TCP:127.0.0.1:8888,connect-timeout=5 | grep -Eq '^HTTP/1[.][01] 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # CRW API server. Configured entirely via CRW_* env vars
  # (no config file mount needed — env layer wins over the baked-in
  # config.default.toml). CRW reaches only its API callers, CDP shim, SearXNG,
  # and prefetch egress bridge on dedicated internal networks.
  crw:
    image: ${CRW_IMAGE:?CRW_IMAGE must be set}
    restart: unless-stopped
    # Docker's embedded resolver continues to provide service discovery and
    # forwards unresolved external names to the loopback validation resolver
    # in this network namespace. No browsing name leaves CRW's namespace.
    dns: [127.0.0.1]
    networks: [crw-api, crw-cdp, crw-search, crw-prefetch-egress]
    environment:
      RUST_LOG: "info"
      # Override the baked-in config.default.toml via env vars (highest precedence).
      # Keep the wrapper's established CRW API port for service gateways.
      CRW_SERVER__PORT: "3010"
      # Constrain CRW's JS renderer ladder to the chrome tier, which points at
      # obscura through the CDP shim. This does not force every request directly
      # to CDP: with render_js_default unset, CRW still performs its HTTP
      # prefetch first, then escalates to chrome/obscura when the prefetch is
      # blocked, thin, or JS-required.
      CRW_RENDERER__MODE: "chrome"
      # Auto mode (render_js_default unset): CRW runs an HTTP prefetch first,
      # then escalates to the CDP renderer (obscura) when the prefetch returns
      # an error or a 403/blocked status. The prefetch-blocking proxy
      # (prefetch-blocking-proxy service on port 3128) intercepts the HTTP
      # prefetch and returns 403 for search-engine URLs, forcing CRW to escalate
      # to obscura for those pages. Non-search HTTPS URLs are tunneled through
      # the configured egress path; plain HTTP URLs are blocked unless
      # EGRESS_ALLOW_HTTP_URLS=true.
      #
      # We do NOT set render_js_default=true because that mode runs the HTTP
      # prefetch unconditionally and does NOT escalate to CDP on prefetch
      # failure (the ? operator propagates the error). Auto mode does escalate
      # on failure/403, which is what we need.
      # CRW_RENDERER__RENDER_JS_DEFAULT is intentionally unset.
      # Point the chrome renderer at the CDP shim (port 9224), not obscura
      # directly (port 9222). The shim strips CRW's conflicting STEALTH_JS
      # injection, injects per-URL waitUntil into Page.navigate, and strips
      # proxyServer if a future CRW_CRAWLER__PROXY path creates a per-request
      # browser context.
      # The /devtools/ path makes crw skip /json/version discovery and
      # connect directly.
      CRW_RENDERER__CHROME__WS_URL: "ws://cdp-shim:9224/devtools/browser"
      # Route CRW's HTTP prefetch through the prefetch-blocking proxy via
      # reqwest's env-var proxy support (HTTPS_PROXY/HTTP_PROXY). We do NOT
      # use CRW_CRAWLER__PROXY because that sets REQUEST_PROXY, which causes
      # CRW to include proxyServer in Target.createBrowserContext with a
      # hardcoded 2-second timeout. On Tor/slow paths, createBrowserContext
      # takes >2s → "Timeout after 2000ms" → 504. Using env-var proxies
      # routes the HTTP prefetch through the blocking proxy without setting
      # REQUEST_PROXY, so the CDP path uses the no-proxy fetcher (no
      # proxyServer in createBrowserContext, no 2s timeout).
      #
      # The proxy returns 403 for search engine URLs, forcing CRW to escalate
      # to the CDP renderer (obscura). Other HTTPS URLs are tunneled. Plain
      # HTTP URLs are blocked unless EGRESS_ALLOW_HTTP_URLS=true.
      HTTPS_PROXY: "http://crw-prefetch-bridge:3128"
      HTTP_PROXY: "http://crw-prefetch-bridge:3128"
      # Exclude the explicit CDP and search peers from the prefetch proxy.
      # The CDP connection uses the websockets crate (not
      # reqwest), so HTTPS_PROXY doesn't affect it, but NO_PROXY is set
      # for completeness.
      NO_PROXY: "127.0.0.1,localhost,::1,cdp-shim,searxng-core"
      # Per-page navigation timeout for the chrome (obscura) renderer tier.
      # CRW's default page_timeout_ms is 30s, but when EGRESS_UPSTREAM_PROXY_URL routes
      # through Tor or a slow VPN, obscura's waitUntil=networkidle2 can
      # take up to 45s (OBSCURA_NAV_TIMEOUT_MS). This must be ≥
      # OBSCURA_NAV_TIMEOUT_MS so CRW's page_timeout doesn't fire before
      # obscura's nav timeout. Set to 50000 to give 5s of headroom.
      CRW_RENDERER__CHROME_TIMEOUT_MS: "${CRW_RENDERER__CHROME_TIMEOUT_MS:-50000}"
      # HTTP prefetch timeout. CRW always runs an HTTP prefetch before the
      # CDP renderer (even with RENDER_JS_DEFAULT=true) to check Content-Type
      # and content type. On the happy path the prefetch completes in 1-3s;
      # this is a ceiling, not a delay. Increasing it from the default 30s to
      # 60s raises CRW's effective per-request deadline (ladder_min) from
      # ~108s to ~138s, giving queued requests in the per-host rate limiter
      # more budget before their deadline expires. No happy-path impact.
      CRW_RENDERER__HTTP_TIMEOUT_MS: "${CRW_RENDERER__HTTP_TIMEOUT_MS:-60000}"
      # Baseline per-request deadline (ms). With auto_extend_deadline_for_ladder
      # (default true), the effective deadline is max(this, ladder_min). Since
      # ladder_min=~138s, setting this to 300000 (5 min) makes it the effective
      # deadline instead, accommodating multi-request scenarios where the agent
      # issues many parallel open_url or search queries. This gives queued
      # requests in the per-host rate limiter (PER_HOST_MAX_CONCURRENT=1) enough
      # deadline budget to complete after waiting behind earlier requests, while
      # still serializing per-host to avoid 429s. No happy-path impact — fast
      # pages complete in ~1-5s regardless. The Tower outer timeout auto-widens
      # to cover this. See docs/request_handling.md §1.6.1.
      CRW_REQUEST__DEADLINE_MS_DEFAULT: "${CRW_REQUEST__DEADLINE_MS_DEFAULT:-300000}"
      # Post-navigate budget for the chrome (obscura) renderer tier.
      # This is the inner race that wraps wait_for_page_ready +
      # post_navigate_phase (SPA selector poll, content stability, challenge
      # retry). CRW's default is 12000ms (calibrated as p90 of successful
      # renders on fast networks), but on Tor/slow VPN, obscura's navigation
      # alone can take 20-40s. When this budget fires before the page loads,
      # CRW returns "Timeout after 12000ms" → 504 Gateway Timeout.
      # Set to 48000 (just under OBSCURA_NAV_TIMEOUT_MS=45000 + overhead)
      # so the nav budget doesn't fire before obscura's adaptive waitUntil
      # has a chance to complete.
      CRW_RENDERER__CHROME_NAV_BUDGET_MS: "${CRW_RENDERER__CHROME_NAV_BUDGET_MS:-48000}"
      # /v1/search backed by the wrapper's bundled SearXNG sidecar.
      CRW_SEARCH__SEARXNG_URL: "http://searxng-core:8888"
      # ── Per-host rate limiting (anti-429) ──────────────────────────────
      # CRW's host_limiter (crates/crw-renderer/src/host_limiter.rs) enforces
      # a minimum interval between requests to the same eTLD+1. The
      # FallbackRenderer (which handles /v1/scrape from SearXNG engines)
      # uses crawler.requests_per_second to compute the per-host interval
      # (interval = 1/rps). The default 10 RPS = 100ms interval, which lets
      # multiple simultaneous Onyx search queries or SEARXNG_ROUND_ROBIN=false
      # fan-out hit a provider nearly simultaneously from the same VPN IP and
      # trigger 429s.
      # 0.33 RPS = ~3s interval between requests to the same eTLD+1,
      # serializing the burst that Onyx's parallel web_search queries create.
      # Keyed by eTLD+1 so www.google.com and google.com share one limiter.
      CRW_CRAWLER__REQUESTS_PER_SECOND: "0.33"
      # Cap concurrent in-flight requests per host at 1 (this is already the
      # default, but set explicitly). Combined with the RPS limit above,
      # this fully serializes per-provider requests: the host_limiter
      # semaphore is acquired before the fetch and held until the CDP render
      # completes, so a second query to the same engine waits for the first.
      #
      # Deadline compounding: the semaphore blocks queued requests while
      # their per-request deadline clock keeps ticking. On Tor/slow VPN
      # where a single nav takes ~45s, the 3rd request to the same provider
      # (e.g. 3 search queries → 3 Google requests) will have most of its
      # ~108s deadline consumed by the time it
      # acquires the semaphore, leaving insufficient nav budget. This is
      # acceptable — SearXNG aggregates partial results from engines that
      # succeed. See docs/request_handling.md §1.6.1.
      CRW_CRAWLER__PER_HOST_MAX_CONCURRENT: "1"
      # Add ±20% jitter to the rate-limit interval so request timing doesn't
      # look mechanically regular (a bot signal in itself). This is the
      # stealth jitter_factor applied to the per-host limiter sleep in the
      # crawl loop. (The scrape path does not yet apply jitter — see CRW
      # lib.rs fetch(); the jitter is consumed by crw-crawl and crw-monitor.)
      CRW_CRAWLER__STEALTH__JITTER_FACTOR: "0.2"
    healthcheck:
      # The crw image (debian:bookworm-slim) has no wget/curl, but has
      # /bin/sh + getent + grep + the crw CLI. First require the synthetic
      # validation-DNS result, then scrape the server's own /health endpoint
      # via the crw binary and grep for the status field. The crw CLI always
      # exits 0, so the grep exit code is the real API signal.
      test: ["CMD-SHELL", "getent ahostsv4 crw-validation.test | grep -q '93[.]184[.]216[.]34' && crw scrape http://127.0.0.1:3010/health --format json 2>/dev/null | grep -q status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    depends_on:
      crw-prefetch-bridge:
        condition: service_healthy
      cdp-shim:
        condition: service_healthy
      searxng-core:
        condition: service_healthy

  host-searxng-proxy:
    <<: *tcp-gateway
    command: ["tcp-listen:8888,fork,reuseaddr", "tcp-connect:searxng-core:8888"]
    networks: [searxng-api, host-publish]
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${HOST_PORT_SEARXNG:-8080}:8888
    depends_on:
      searxng-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | socat -T 5 STDIO,ignoreeof TCP:127.0.0.1:8888,connect-timeout=5 | grep -Eq '^HTTP/1[.][01] 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional fixed HTTP gateway for Tailscale ingress. Profiles keep both the
  # gateway and Funnel container structurally absent when the feature is off.
  tailscale-frontend-gateway:
    image: ${BASE_IMAGE_REGISTRY:-docker.io}/library/nginx:1.25.5-alpine
    profiles: [tailscale]
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [tailscale-ingress, onyx-frontend]
    volumes:
      - ./tailscale/frontend-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp
    depends_on:
      nginx: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Set TAILSCALE_FUNNEL_ROUTE_THROUGH_MYST_VPN=true in .env.wrapper to route
  # Tailscale through the Mysterium VPN namespace (applies
  # docker-compose.tailscale-vpn.yml via Makefile layering).
  tailscale-funnel:
    image: ${TAILSCALE_IMAGE:?TAILSCALE_IMAGE must be set}
    profiles: [tailscale]
    entrypoint: ["/usr/local/bin/tailscale-entrypoint.sh"]
    restart: unless-stopped
    networks: [tailscale-ingress, tailscale-uplink]
    environment:
      TAILSCALE_FUNNEL_ENABLED: "${TAILSCALE_FUNNEL_ENABLED:-false}"
      TAILSCALE_FUNNEL_TARGET_HOST: "tailscale-frontend-gateway"
      TAILSCALE_FUNNEL_TARGET_PORT: "8080"
      TAILSCALE_FUNNEL_HTTPS_PORT: "443"
      TS_AUTHKEY: "${TAILSCALE_FUNNEL_AUTHKEY:-}"
      TS_HOSTNAME: "${TAILSCALE_FUNNEL_HOSTNAME:-onyx-funnel}"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "true"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_EXTRA_ARGS: "${TAILSCALE_FUNNEL_UP_ARGS:-}"
    volumes:
      - ./docker-data/tailscale:/var/lib/tailscale
      - ./tailscale/entrypoint.sh:/usr/local/bin/tailscale-entrypoint.sh:ro
    depends_on:
      tailscale-frontend-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "enabled=$$(printf '%s' \"$${TAILSCALE_FUNNEL_ENABLED:-false}\" | tr '[:upper:]' '[:lower:]'); if [ \"$$enabled\" != \"1\" ] && [ \"$$enabled\" != \"true\" ] && [ \"$$enabled\" != \"yes\" ] && [ \"$$enabled\" != \"on\" ]; then exit 0; fi; tailscale status >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Onyx application tier. Every attached network is internal; external and
  # host-local HTTP(S) access is available only through fixed policy bridges.
  api_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: api_server
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    networks:
      [onyx-frontend, onyx-backend, onyx-data, onyx-public-egress, onyx-host-egress, onyx-teep]
    # Shared, stack-owned internal-service bypasses. This file is deliberately
    # not part of the user-facing .env.wrapper configuration surface.
    env_file:
      - path: ./onyx/helper-egress.env
        required: true
    environment:
      CODE_INTERPRETER_BASE_URL: "http://code-interpreter:8000"
      # Generated by the Makefile for each stack start. Existing auth cookies,
      # password-reset tokens, and email-verification tokens expire on restart.
      USER_AUTH_SECRET: "${USER_AUTH_SECRET:?USER_AUTH_SECRET must be set}"
      # Generated by the Makefile for each full-mode stack start. In lite mode
      # FILE_STORE_BACKEND=postgres, so these values are unused.
      S3_AWS_ACCESS_KEY_ID: "${S3_AWS_ACCESS_KEY_ID:?S3_AWS_ACCESS_KEY_ID must be set}"
      S3_AWS_SECRET_ACCESS_KEY: "${S3_AWS_SECRET_ACCESS_KEY:?S3_AWS_SECRET_ACCESS_KEY must be set}"
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      # Controls Web connector SSRF-style URL checks.
      OPEN_URL_VALIDATE_SSRF: "true"
      MCP_SERVER_ALLOW_PRIVATE_NETWORK: "true"
      MCP_SERVER_ALLOW_LOOPBACK: "false"
      # Wrapper-level alias for Onyx's asymmetric query prefix setting.
      ASYM_QUERY_PREFIX: "${ONYX_RAG_EMBEDDING_QUERY_PREFIX:-}"
      # Interactive chat tool-call loop cap (per request).
      MAX_LLM_CYCLES: "${MAX_LLM_CYCLES:-200}"
      # Nested Deep Research limits. Keep call acceptance separate from bounded
      # execution concurrency so model-emitted calls are not silently dropped.
      MAX_RESEARCH_AGENT_CYCLES: "${MAX_RESEARCH_AGENT_CYCLES:-200}"
      MAX_DEEP_RESEARCH_TOOL_CALLS_PER_BATCH: "${MAX_DEEP_RESEARCH_TOOL_CALLS_PER_BATCH:-256}"
      MAX_DEEP_RESEARCH_PARALLEL_TOOLS: "${MAX_DEEP_RESEARCH_PARALLEL_TOOLS:-1}"
      # Wrapper alias for Onyx's GEN_AI_MAX_TOKENS override. Empty means no
      # override; when set, sitecustomize makes this win over stored DB and
      # provider-advertised context limits.
      GEN_AI_MAX_TOKENS: "${ONYX_AGENT_LLM_MAX_TOKENS:-}"
      # Optional wrapper-level overrides for open_url content truncation.
      # Leave empty to use Onyx defaults.
      ONYX_OPEN_URL_MAX_CHARS_PER_URL: "${ONYX_OPEN_URL_MAX_CHARS_PER_URL:-}"
      ONYX_OPEN_URL_MAX_TOTAL_CHARS: "${ONYX_OPEN_URL_MAX_TOTAL_CHARS:-}"
      # One byte-oriented ceiling for coding-agent repository tarballs and the
      # code-interpreter file API that receives them. This is intentionally
      # separate from the post-fetch open_url character budgets above.
      ONYX_CODE_INTERPRETER_MAX_FILE_SIZE_MB: "${ONYX_CODE_INTERPRETER_MAX_FILE_SIZE_MB:-1000}"
      HTTP_PROXY: "http://onyx-public-egress-bridge:3128"
      HTTPS_PROXY: "http://onyx-public-egress-bridge:3128"
      http_proxy: "http://onyx-public-egress-bridge:3128"
      https_proxy: "http://onyx-public-egress-bridge:3128"
      ONYX_HELPER_HTTP_PROXY_URL: "http://onyx-public-egress-bridge:3128"
      ONYX_MCP_PUBLIC_HTTP_PROXY_URL: "http://onyx-public-egress-bridge:3128"
      ONYX_MCP_HOST_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
      ONYX_WEB_CONNECTOR_PUBLIC_HTTP_PROXY_URL: "http://onyx-public-egress-bridge:3128"
      ONYX_WEB_CONNECTOR_HOST_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
      ONYX_CONFIGURED_INFERENCE_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
      ONYX_CONFIGURED_INFERENCE_INTERNAL_BASE_URL: "http://teep:8337/v1"
      # When true, previous-turn tool responses are preserved in future LLM
      # context instead of being replaced with Onyx's generic placeholder.
      ONYX_AGENT_PRESERVE_TOOL_RESULTS: "${ONYX_AGENT_PRESERVE_TOOL_RESULTS:-true}"
      # Force model_is_reasoning_model() true for wrapper-managed agents when
      # the OpenAI-compatible provider streams reasoning_content but LiteLLM
      # cannot identify the provider/model pair as reasoning-capable.
      ONYX_AGENT_USE_NATIVE_REASONING: "${ONYX_AGENT_USE_NATIVE_REASONING:-true}"
      # Preserve current-turn assistant reasoning across tool calls by default.
      ONYX_AGENT_PRESERVE_TURN_REASONING: "${ONYX_AGENT_PRESERVE_TURN_REASONING:-true}"
      # Optionally preserve assistant reasoning from all prior turns too.
      ONYX_AGENT_PRESERVE_ALL_REASONING: "${ONYX_AGENT_PRESERVE_ALL_REASONING:-false}"
      # Give nested Deep Research agents the tools selected for the current chat
      # Agent; sitecustomize preserves all accepted calls with bounded workers.
      ONYX_DEEP_RESEARCH_PROVIDE_CHAT_AGENT_TOOLS: "${ONYX_DEEP_RESEARCH_PROVIDE_CHAT_AGENT_TOOLS:-true}"
      # Fail startup if wrapper monkey patches no longer match upstream Onyx.
      WRAPPER_PATCH_STRICT: "true"
      # Page load waiting is handled by the CDP shim's waitUntil injection
      # (OBSCURA_BROWSER_WAIT_UNTIL_WEB=load for web pages), not by a CRW
      # waitFor sleep. The sitecustomize patch ensures FirecrawlClient
      # omits waitFor from
      # /v2/scrape payloads. See docs/request_handling.md §1.6.
      # Base wrapper sitecustomize patches (applies to full and lite compose).
      PYTHONPATH: "/app/wrapper-patches-base:${PYTHONPATH:-}"
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    # Full-mode shim + tokenizer bootstrap can exceed upstream healthcheck grace.
    # Give API startup enough time so autoheal does not recycle it mid-init.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 240s
    depends_on:
      # crw is optional for Onyx, but wiring
      # the dependency avoids a first-request race if Onyx's Web Search
      # connector is configured to point at crw's /v1/scrape endpoint.
      crw:
        condition: service_healthy
      crw-service-gateway:
        condition: service_healthy
      searxng-service-gateway:
        condition: service_healthy
      onyx-public-egress-bridge:
        condition: service_healthy
      onyx-host-egress-bridge:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - ./docker-data/model-cache:/app/.cache/huggingface
      - ./docker-data/model-cache:/root/.cache/huggingface
      - ./onyx/patches/sitecustomize_base:/app/wrapper-patches-base:ro
      - api_server_logs:/var/log/onyx

  web_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: web_server
    image: onyxdotapp/onyx-web-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    networks: [onyx-frontend]
    environment:
      # Disable frontend analytics/instrumentation and cloud billing flows.
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
      # Minimum password length enforced by the backend and surfaced in the UI.
      PASSWORD_MIN_LENGTH: "8"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api_server:
        condition: service_healthy

  nginx:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: nginx
    networks: [onyx-frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports: !reset []
    depends_on:
      api_server:
        condition: service_healthy
      web_server:
        condition: service_healthy

  # Docker Desktop does not activate published ports for containers attached
  # only to internal networks. Keep nginx isolated and publish it through one
  # hardened fixed-destination forwarder on a non-masqueraded host edge.
  host-webui-publisher:
    <<: *tcp-gateway
    command: ["tcp-listen:3000,fork,reuseaddr", "tcp-connect:nginx:80"]
    networks: [onyx-frontend, host-publish]
    ports:
      - ${ONYX_WEBUI_HOST:+${ONYX_WEBUI_HOST}:}${HOST_PORT_ONYX_WEBUI:-3000}:3000
    depends_on:
      nginx: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' | socat -T 5 STDIO,ignoreeof TCP:127.0.0.1:3000,connect-timeout=5 | grep -q '^HTTP/'"]
      interval: 30s
      timeout: 10s
      retries: 3

  code-interpreter:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: code-interpreter
    image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:?CODE_INTERPRETER_IMAGE_TAG must be set}
    networks: [onyx-backend]
    environment:
      PORT: "8000"
      CODE_INTERPRETER_BASE_URL: "http://code-interpreter:8000"
      # Executor pod resource limits (defaults are tight: 256MB RAM, 5s CPU,
      # 1MB output). Raise them for data analysis / matplotlib workloads.
      MEMORY_LIMIT_MB: "${ONYX_CODE_INTERPRETER_MEMORY_LIMIT_MB:-512}"
      CPU_TIME_LIMIT_SEC: "${ONYX_CODE_INTERPRETER_CPU_TIME_LIMIT_SEC:-60}"
      MAX_OUTPUT_BYTES: "${ONYX_CODE_INTERPRETER_MAX_OUTPUT_BYTES:-20000000}"
      MAX_EXEC_TIMEOUT_MS: "${ONYX_CODE_INTERPRETER_MAX_EXEC_TIMEOUT_MS:-120000}"
      MAX_FILE_SIZE_MB: "${ONYX_CODE_INTERPRETER_MAX_FILE_SIZE_MB:-1000}"
    depends_on: !reset {}

  # Teep: private verified LLM inference proxy.
  # Default: uses a dedicated internal Onyx service network plus a direct
  # uplink (no VPN). Its port is published to the host directly.
  # Set TEEP_ROUTE_THROUGH_MYST_VPN=true in .env.wrapper to route teep through
  # the Mysterium VPN namespace (applies docker-compose.teep-vpn.yml via
  # Makefile layering).
  teep:
    image: ${TEEP_IMAGE:-13rac1/teep:${TEEP_REF:?TEEP_REF must be set}}
    restart: unless-stopped
    networks: [onyx-teep, teep-uplink]
    ports:
      - ${TEEP_HOST:+${TEEP_HOST}:}${HOST_PORT_TEEP:-8337}:8337
    environment:
      TEEP_LISTEN_ADDR: "${TEEP_LISTEN_ADDR:-0.0.0.0:8337}"
      TEEP_MAX_CONNS: "${TEEP_MAX_CONNS:-6}"
      TEEP_SERVE_ARGS: "${TEEP_SERVE_ARGS:-}"
      VENICE_API_KEY: "${TEEP_VENICE_API_KEY:-}"
      TINFOIL_API_KEY: "${TEEP_TINFOIL_API_KEY:-}"
      NEARAI_API_KEY: "${TEEP_NEARAI_API_KEY:-}"
      CHUTES_API_KEY: "${TEEP_CHUTES_API_KEY:-}"
      PHALA_API_KEY: "${TEEP_PHALA_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8337/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  relational_db:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: relational_db
    volumes: !override
      - ./docker-data/postgres:/var/lib/postgresql/data
    networks: [onyx-data]

networks:
  routing-uplink: {}
  teep-uplink: {}
  tailscale-uplink: {}
  # Port publication requires a non-internal Docker edge on Docker Desktop.
  # Only hardened fixed-destination publishers join it. Disabling masquerade
  # prevents it from becoming a general Internet-NAT path.
  host-publish:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  tailscale-ingress: {internal: true}
  onyx-frontend: {internal: true}
  onyx-backend: {internal: true}
  onyx-data: {internal: true}
  onyx-teep: {internal: true}
  onyx-public-egress: {internal: true}
  onyx-host-egress: {internal: true}
  onyx-public-policy-upstream: {internal: true}
  onyx-host-policy-upstream: {internal: true}
  onyx-public-broker: {internal: true}
  onyx-host-broker: {internal: true}
  prefetch-policy-upstream: {internal: true}
  browser-policy-upstream: {internal: true}
  crw-api: {internal: true}
  crw-cdp: {internal: true}
  crw-search: {internal: true}
  crw-prefetch-egress: {internal: true}
  searxng-api: {internal: true}
  searxng-valkey: {internal: true}
  obscura-control: {internal: true}
  browser-egress: {internal: true}

volumes:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:
  obscura-data:
