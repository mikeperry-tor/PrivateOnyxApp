## Wrapper stack for sharing one Mysterium VPN namespace across SearxNG + Onyx.
##
## Use .env.wrapper for wrapper-specific image tags and host port mappings.
## Preferred entrypoints:
##   make up       (default lite mode)
##   make up-full  (full mode)

name: onyx

services:
  # Stable owner for the shared network namespace.
  # All VPN-routed services join this namespace so myst-client can restart
  # without invalidating other containers' network namespace references.
  netns-holder:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      default:
        aliases:
          - myst-client
          - api_server
          - web_server
          - background
          - nginx
          - code-interpreter

  # VPN gateway for SearxNG-routed workloads
  myst-client:
    extends:
      file: ./myst/docker-compose.yaml
      service: myst-client
    labels:
      autoheal: "true"
    # Join the stable namespace owned by netns-holder.
    network_mode: "service:netns-holder"
    # Keep myst-client internal-only. Host port publishing is handled by
    # dedicated bridge proxies below so host access remains stable even when
    # VPN routing is active in this namespace.
    ports: []
    environment:
      # Optional LAN access bypass for local inference APIs / services.
      ALLOW_LAN_ACCESS: "${ALLOW_LAN_ACCESS:-false}"
      # WireGuard MTU override to fix HTTPS timeouts on path MTU constraints
      # Set to 1280 to work around ISP upstream path MTU constraints
      MYST_WIREGUARD_MTU: "1280"
    volumes: !override
      - ./docker-data/myst-data:/var/lib/mysterium-node
      - ./docker-data/myst-data:/root/.mysterium
      - ./myst/myst-client-entrypoint.sh:/usr/local/bin/myst-client-entrypoint.sh:ro
    depends_on:
      netns-holder:
        condition: service_started

  searxng-core:
    extends:
      file: ./searxng/docker-compose.yml
      service: core
    environment:
      SEARXNG_PORT: ${SEARXNG_CONTAINER_PORT:-8888}
    network_mode: "service:netns-holder"
    volumes: !override
      - ./searxng/core-config/:/etc/searxng/:Z
      - ./docker-data/searxng-cache:/var/cache/searxng
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  searxng-valkey:
    extends:
      file: ./searxng/docker-compose.yml
      service: valkey
    volumes: !override
      - ./docker-data/valkey:/data

  # ── fastCRW (crw) + obscura stealth CDP browser ─────────────────────────
  # Self-hosted Firecrawl-compatible scraper (available in both lite and full
  # mode), routed through Myst. crw exposes the Firecrawl-compatible
  # /v1/scrape, /v1/crawl, /v1/map, and /v1/search endpoints that Onyx's Web
  # Search connector can target.
  #
  # The JS renderer tier is obscura (a Rust-native headless browser with
  # built-in stealth), replacing crw's upstream browserless/chrome-stealth
  # profile. obscura exposes a CDP WebSocket on port 9222 that crw drives via
  # its `cdp` cargo feature. Both services run inside the shared netns-holder
  # namespace so scrape/crawl traffic egresses through the VPN endpoint IP.
  #
  # Both images are pulled from their upstream registries (no local builds):
  #   - obscura: h4ckf0r0day/obscura (release builds include the stealth feature)
  #   - crw:     ghcr.io/us/crw (built with --features cdp upstream)
  # crw is configured entirely via CRW_* env vars (Figment env layer has the
  # highest precedence — see crates/crw-core/src/config.rs AppConfig::load).

  # Stealth headless browser: serves a Chrome DevTools Protocol WebSocket.
  # Release binaries include the stealth feature, so --stealth at runtime
  # enables the full anti-fingerprint + tracker-blocking domain.
  # crw connects to ws://obscura:9222/devtools/browser.
  obscura:
    image: h4ckf0r0day/obscura:latest
    restart: unless-stopped
    network_mode: "service:netns-holder"
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9222"
      - "--stealth"
    healthcheck:
      # The obscura image is distroless (no shell, no wget/curl), so the
      # healthcheck uses the obscura binary's own `fetch` subcommand against
      # the /json/version HTTP endpoint. --dump original bypasses the JS/DOM
      # layer (raw response body); --allow-private-network permits loopback;
      # --quiet suppresses the banner. /json/version is served on the
      # dedicated accept thread (issue #62) so it stays responsive even while
      # V8 JS evaluation blocks the LocalSet.
      test: ["CMD", "/obscura", "fetch", "http://127.0.0.1:9222/json/version", "--dump", "original", "--allow-private-network", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  # Firecrawl-compatible API server. Configured entirely via CRW_* env vars
  # (no config file mount needed — env layer wins over the baked-in
  # config.default.toml). CRW_SERVER__PORT moves it off 3000 (taken by
  # web_server in the shared netns). CRW_RENDERER__CHROME__WS_URL points at
  # the obscura CDP endpoint; CRW_SEARCH__SEARXNG_URL points /v1/search at
  # the wrapper's bundled SearXNG sidecar (127.0.0.1:8888 in the netns).
  crw:
    image: ghcr.io/us/crw:latest
    restart: unless-stopped
    network_mode: "service:netns-holder"
    environment:
      RUST_LOG: "info"
      # Override the baked-in config.default.toml via env vars (highest precedence).
      # Move crw off port 3000 (taken by web_server in the shared netns).
      CRW_SERVER__PORT: "3010"
      # Point the chrome renderer at obscura's CDP endpoint. The /devtools/
      # path makes crw skip /json/version discovery and connect directly.
      CRW_RENDERER__CHROME__WS_URL: "ws://127.0.0.1:9222/devtools/browser"
      # /v1/search backed by the wrapper's bundled SearXNG sidecar.
      CRW_SEARCH__SEARXNG_URL: "http://127.0.0.1:8888"
    healthcheck:
      # The crw image (debian:bookworm-slim) has no wget/curl, but has
      # /bin/sh + grep + the crw CLI. We scrape the server's own /health
      # endpoint via the crw binary and grep for the status field. The crw
      # CLI always exits 0, so the grep exit code is the real signal: when
      # the server is down, the scrape produces no stdout (connection refused)
      # and grep fails; when up, /health returns {"status":"ok",...}.
      test: ["CMD-SHELL", "crw scrape http://127.0.0.1:3010/health --format json 2>/dev/null | grep -q status || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      obscura:
        condition: service_healthy

  # Host-facing TCP bridges. These run on the normal compose network and
  # forward host traffic to services inside the shared netns-holder namespace
  # (reachable through the myst-client alias on the default network).
  host-web-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:3000,fork,reuseaddr tcp-connect:myst-client:80
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_started
        restart: true

  host-searxng-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${SEARXNG_CONTAINER_PORT:-8888},fork,reuseaddr tcp-connect:myst-client:${SEARXNG_CONTAINER_PORT:-8888}
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_CONTAINER_PORT:-8888}
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_started
        restart: true

  host-teep-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${TEEP_PORT:-8337},fork,reuseaddr tcp-connect:myst-client:${TEEP_CONTAINER_PORT:-8337}
    ports:
      - ${TEEP_HOST:+${TEEP_HOST}:}${TEEP_PORT:-8337}:${TEEP_CONTAINER_PORT:-8337}
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_started
        restart: true

  # Restarts containers marked with autoheal=true when Docker health is unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      myst-client:
        condition: service_started

  # Optional Tailscale Funnel bridge for exposing the Onyx WebUI publicly.
  # This service intentionally stays on the default compose network so it
  # does not inherit Myst VPN routing from netns-holder.
  tailscale-funnel:
    image: tailscale/tailscale:stable
    entrypoint: ["/usr/local/bin/tailscale-entrypoint.sh"]
    restart: unless-stopped
    environment:
      TAILSCALE_FUNNEL_ENABLED: "${TAILSCALE_FUNNEL_ENABLED:-false}"
      TAILSCALE_FUNNEL_TARGET_HOST: "host-web-proxy"
      TAILSCALE_FUNNEL_TARGET_PORT: "3000"
      TAILSCALE_FUNNEL_HTTPS_PORT: "443"
      TS_AUTHKEY: "${TAILSCALE_AUTHKEY:-}"
      TS_HOSTNAME: "${TAILSCALE_HOSTNAME:-onyx-funnel}"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "true"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_EXTRA_ARGS: "${TAILSCALE_EXTRA_ARGS:-}"
    volumes:
      - ./docker-data/tailscale:/var/lib/tailscale
      - ./tailscale/entrypoint.sh:/usr/local/bin/tailscale-entrypoint.sh:ro
    depends_on:
      host-web-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "enabled=$$(printf '%s' \"$${TAILSCALE_FUNNEL_ENABLED:-false}\" | tr '[:upper:]' '[:lower:]'); if [ \"$$enabled\" != \"1\" ] && [ \"$$enabled\" != \"true\" ] && [ \"$$enabled\" != \"yes\" ] && [ \"$$enabled\" != \"on\" ]; then exit 0; fi; tailscale status >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Onyx app tier (routed through the shared netns-holder namespace)
  api_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: api_server
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:netns-holder"
    environment:
      # code-interpreter runs on 7000 in the shared netns (8000 is taken by background prometheus).
      CODE_INTERPRETER_BASE_URL: "http://localhost:7000"
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      # Controls Web connector SSRF-style URL checks.
      OPEN_URL_VALIDATE_SSRF: ${OPEN_URL_VALIDATE_SSRF:-}
      MCP_SERVER_ALLOW_PRIVATE_NETWORK: ${MCP_SERVER_ALLOW_PRIVATE_NETWORK:-}
      MCP_SERVER_ALLOW_LOOPBACK: ${MCP_SERVER_ALLOW_LOOPBACK:-}
      # Wrapper-level alias for Onyx's asymmetric query prefix setting.
      ASYM_QUERY_PREFIX: "${ONYX_EMBEDDING_QUERY_PREFIX:-}"
      # Interactive chat + deep-research tool-call loop cap (per request); we want long research capability
      MAX_LLM_CYCLES: "${MAX_LLM_CYCLES:-50}"
      # Optional wrapper-level overrides for open_url content truncation.
      # Leave empty to use Onyx defaults.
      OPEN_URL_MAX_CHARS_PER_URL: "${OPEN_URL_MAX_CHARS_PER_URL:-}"
      OPEN_URL_MAX_CHARS_ACROSS_URLS: "${OPEN_URL_MAX_CHARS_ACROSS_URLS:-}"
      # Base wrapper sitecustomize patches (applies to full and lite compose).
      PYTHONPATH: "/app/wrapper-patches-base:${PYTHONPATH:-}"
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    # Full-mode shim + tokenizer bootstrap can exceed upstream healthcheck grace.
    # Give API startup enough time so autoheal does not recycle it mid-init.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 240s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      # crw (Firecrawl-compatible scraper) is optional for Onyx, but wiring
      # the dependency avoids a first-request race if Onyx's Web Search
      # connector is configured to point at crw's /v1/scrape endpoint.
      crw:
        condition: service_started
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - ./docker-data/model-cache:/app/.cache/huggingface
      - ./docker-data/model-cache:/root/.cache/huggingface
      - ./onyx/patches/sitecustomize_base:/app/wrapper-patches-base:ro
      - api_server_logs:/var/log/onyx

  web_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: web_server
    image: onyxdotapp/onyx-web-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:netns-holder"
    environment:
      # Disable frontend analytics/instrumentation and cloud billing flows.
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
      # Minimum password length enforced by the backend and surfaced in the UI.
      PASSWORD_MIN_LENGTH: "8"
    # In shared netns mode, Next.js may bind eth0 only (not loopback), so
    # healthcheck probes the namespace IP instead of 127.0.0.1.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ip=$$(hostname -i | awk '{print $1}'); wget -q -T 5 -O /dev/null http://$$ip:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  nginx:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: nginx
    network_mode: "service:netns-holder"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports: !reset []
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  code-interpreter:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: code-interpreter
    #image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:?CODE_INTERPRETER_IMAGE_TAG must be set}
    image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:?CODE_INTERPRETER_IMAGE_TAG must be set}
    network_mode: "service:netns-holder"
    # Port 8000 is occupied in the shared myst netns by background's Prometheus
    # metrics server (hardcoded start_http_server(8000) in slack/listener.py).
    # Redirect code-interpreter to 7000 and point api_server/background at it.
    environment:
      PORT: "7000"
      CODE_INTERPRETER_BASE_URL: "http://localhost:7000"
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  teep:
    image: ${TEEP_IMAGE:-13rac1/teep:main}
    restart: unless-stopped
    network_mode: "service:netns-holder"
    environment:
      TEEP_LISTEN_ADDR: "${TEEP_LISTEN_ADDR:-0.0.0.0:${TEEP_CONTAINER_PORT:-8337}}"
      TEEP_MAX_CONNS: "${TEEP_MAX_CONNS:-6}"
      TEEP_SERVE_FLAGS: "${TEEP_SERVE_FLAGS:-}"
      VENICE_API_KEY: "${VENICE_API_KEY:-}"
      NEARAI_API_KEY: "${NEARAI_API_KEY:-}"
      CHUTES_API_KEY: "${CHUTES_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8337/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  relational_db:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: relational_db
    volumes: !override
      - ./docker-data/postgres:/var/lib/postgresql/data

volumes:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:


