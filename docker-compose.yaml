## Wrapper stack for sharing one Mysterium VPN namespace across SearxNG + Onyx.
##
## Use .env.wrapper for wrapper-specific image tags and host port mappings.
## Preferred entrypoints:
##   make up       (default lite mode)
##   make up-full  (full mode)

name: onyx

services:
  # Stable owner for the shared network namespace.
  # All VPN-routed services join this namespace so myst-client can restart
  # without invalidating other containers' network namespace references.
  netns-holder:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      default:
        aliases:
          - myst-client
          - api_server
          - web_server
          - background
          - nginx
          - code-interpreter

  # VPN gateway for SearxNG-routed workloads
  myst-client:
    extends:
      file: ./myst/docker-compose.yaml
      service: myst-client
    labels:
      autoheal: "true"
    # Join the stable namespace owned by netns-holder.
    network_mode: "service:netns-holder"
    # Keep myst-client internal-only. Host port publishing is handled by
    # dedicated bridge proxies below so host access remains stable even when
    # VPN routing is active in this namespace.
    ports: []
    environment:
      # Optional LAN access bypass for local inference APIs / services.
      ALLOW_LAN_ACCESS: "${ALLOW_LAN_ACCESS:-false}"
      # WireGuard MTU override to fix HTTPS timeouts on path MTU constraints
      # Set to 1280 to work around ISP upstream path MTU constraints
      MYST_WIREGUARD_MTU: "1280"
      # Master VPN switch. When "false", myst-client idles the daemon without
      # arming the kill-switch or connecting. See .env.wrapper.example.
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
    depends_on:
      netns-holder:
        condition: service_started

  searxng-core:
    extends:
      file: ./searxng/docker-compose.yml
      service: core
    environment:
      SEARXNG_PORT: ${SEARXNG_CONTAINER_PORT:-8888}
      # Generated by the Makefile for each stack start.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      # Self-hosted crw runs open by default; this is only a non-empty bearer
      # placeholder for SearXNG's crw-backed stub engines.
      CRW_ONYX_API_KEY: ${CRW_ONYX_API_KEY:?CRW_ONYX_API_KEY must be set}
      # Page load waiting is handled by the CDP shim's waitUntil injection
      # (OBSCURA_WAIT_UNTIL_SEARCH=networkidle2 for SERPs,
      # OBSCURA_WAIT_UNTIL_DEFAULT=load for web pages), not by a CRW
      # waitFor sleep. See docs/request_handling.md §1.6 for the full
      # wait strategy.
    network_mode: "service:netns-holder"
    volumes: !override
      - ./searxng/core-config/:/etc/searxng/:Z
      - ./docker-data/searxng-cache:/var/cache/searxng
      # crw + obscura stealth-browser backed stub engines. Mounted as
      # individual files (not the whole dir) so the image's built-in engines
      # are preserved. Loaded by SearXNG via the `engine:` field in
      # settings.yml -- no image rebuild needed. See searxng/engines/_crw.py.
      - ./searxng/engines/_crw.py:/usr/local/searxng/searx/engines/_crw.py:ro
      - ./searxng/engines/google2.py:/usr/local/searxng/searx/engines/google2.py:ro
      - ./searxng/engines/brave2.py:/usr/local/searxng/searx/engines/brave2.py:ro
      - ./searxng/engines/duckduckgo2.py:/usr/local/searxng/searx/engines/duckduckgo2.py:ro
      - ./searxng/engines/startpage2.py:/usr/local/searxng/searx/engines/startpage2.py:ro
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  searxng-valkey:
    extends:
      file: ./searxng/docker-compose.yml
      service: valkey
    volumes: !override
      - ./docker-data/valkey:/data

  # ── fastCRW (crw) + obscura stealth CDP browser ─────────────────────────
  # Self-hosted Firecrawl-compatible scraper (available in both lite and full
  # mode), routed through Myst. crw exposes the Firecrawl-compatible
  # /v1/scrape, /v1/crawl, /v1/map, and /v1/search endpoints that Onyx's Web
  # Search connector can target.
  #
  # The JS renderer tier is obscura (a Rust-native headless browser with
  # built-in stealth), replacing crw's upstream browserless/chrome-stealth
  # profile. obscura exposes a CDP WebSocket on port 9222 that crw drives via
  # its `cdp` cargo feature. Both services run inside the shared netns-holder
  # namespace so scrape/crawl traffic egresses through the VPN endpoint IP.
  #
  # Both images are pulled from their upstream registries (no local builds):
  #   - obscura: h4ckf0r0day/obscura (release builds include the stealth feature)
  #   - crw:     ghcr.io/us/crw (built with --features cdp upstream)
  # crw is configured entirely via CRW_* env vars (Figment env layer has the
  # highest precedence — see crates/crw-core/src/config.rs AppConfig::load).

  # Stealth headless browser: serves a Chrome DevTools Protocol WebSocket.
  # Release binaries include the stealth feature, so --stealth at runtime
  # enables the full anti-fingerprint + tracker-blocking domain.
  # crw connects to ws://obscura:9222/devtools/browser.
  obscura:
    image: ${OBSCURA_IMAGE:-h4ckf0r0day/obscura:0.1.9}
    restart: unless-stopped
    network_mode: "service:netns-holder"
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9222"
      - "--stealth"
      # Persist cookies to /data/obscura so they survive container restarts
      # and are reloaded on BrowserContext creation (obscura's context.rs
      # loads {storage_dir}/cookies.json on init, saves on shutdown). This
      # gives obscura's own BrowserContext cookie continuity across restarts.
      # NOTE: CRW drives obscura via CDP Target.createBrowserContext, which
      # bypasses obscura's Rust BrowserContext API — so this storage_dir
      # does NOT give CRW's per-request CDP contexts cookie persistence.
      # It only helps obscura's MCP/CLI paths. CRW cookie carry-over would
      # require a code change to CRW's cdp.rs (Network.getCookies/setCookies
      # around the per-request context create/dispose cycle).
      - "--storage-dir"
      - "/data/obscura"
    environment:
      # Hard ceiling on a single Page.navigate. Obscura's default is 30s,
      # but when PROXY_URL routes through Tor or a slow VPN, page loads can
      # take up to 60s. Set to 45000 to give obscura enough headroom for
      # the waitUntil=networkidle2 condition (injected by the CDP shim) to
      # resolve on slow proxy paths. Must be ≤ CRW's chrome_timeout_ms
      # (CRW_RENDERER__CHROME_TIMEOUT_MS below) so CRW's outer deadline
      # doesn't fire before obscura's nav timeout.
      OBSCURA_NAV_TIMEOUT_MS: "${OBSCURA_NAV_TIMEOUT_MS:-45000}"
      # Per-CDP-command deadline. A hung page (runaway Runtime.evaluate,
      # synchronous DOM op) is terminated after this budget so one bad
      # session cannot hold the shared V8 lock and stall others. Default
      # 60s; set to 90000 to accommodate slow Tor page renders.
      OBSCURA_CDP_COMMAND_TIMEOUT_MS: "${OBSCURA_CDP_COMMAND_TIMEOUT_MS:-90000}"
      # Request timeout for scripted fetch()/XHR/ES-module loads. Default
      # 30s; bump to 45000 for slow proxy paths.
      OBSCURA_FETCH_TIMEOUT_MS: "${OBSCURA_FETCH_TIMEOUT_MS:-45000}"
    volumes:
      - obscura-data:/data/obscura
    healthcheck:
      # The obscura image is distroless (no shell, no wget/curl), so the
      # healthcheck uses the obscura binary's own `fetch` subcommand against
      # the /json/version HTTP endpoint. --dump original bypasses the JS/DOM
      # layer (raw response body); --allow-private-network permits loopback;
      # --quiet suppresses the banner. /json/version is served on the
      # dedicated accept thread (issue #62) so it stays responsive even while
      # V8 JS evaluation blocks the LocalSet.
      test: ["CMD", "/obscura", "fetch", "http://127.0.0.1:9222/json/version", "--dump", "original", "--allow-private-network", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  # Obscura MCP server: exposes obscura's browser automation tools
  # (browser_navigate, browser_snapshot, browser_click, browser_fill, etc.)
  # as a Model Context Protocol HTTP server that Onyx chat agents can use
  # directly. Runs a separate obscura process from the CDP `serve` instance
  # above so crw's browser driving is not disrupted.
  #
  # The HTTP transport has no built-in auth. It binds 0.0.0.0 inside the
  # netns-holder namespace (only reachable by other services in that namespace
  # + the host-web-proxy bridge). For additional origin restrictions, set
  # OBSCURA_MCP_ALLOWED_ORIGINS.
  #
  # See: https://github.com/h4ckf0r0day/obscura/blob/main/docs/Use-the-MCP-server.md
  obscura-mcp:
    image: ${OBSCURA_IMAGE:-h4ckf0r0day/obscura:0.1.9}
    restart: unless-stopped
    network_mode: "service:netns-holder"
    command:
      - "mcp"
      - "--http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${OBSCURA_MCP_PORT:-9223}"
      - "--stealth"
    environment:
      # Optional comma-separated Origin allowlist for the HTTP transport.
      # When set, browser requests from unlisted origins are refused with 403.
      # Native (non-browser) MCP clients send no Origin and are always allowed.
      OBSCURA_MCP_ALLOWED_ORIGINS: "${OBSCURA_MCP_ALLOWED_ORIGINS:-}"
    healthcheck:
      # The obscura image is distroless. Probe the MCP HTTP endpoint via the
      # obscura binary's own `fetch` subcommand. The MCP server responds to
      # GET / with a JSON-RPC error (method not found) or an SSE stream —
      # either way a non-empty response means the server is up.
      test: ["CMD", "/obscura", "fetch", "http://127.0.0.1:${OBSCURA_MCP_PORT:-9223}/", "--dump", "original", "--allow-private-network", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  # CDP WebSocket proxy shim between CRW and obscura.
  #
  # Sits on port 9224 between CRW and obscura (port 9222) to provide:
  #
  # 1. waitUntil injection — CRW sends Page.navigate without waitUntil.
  #    Obscura's CDP default is domcontentloaded, which can return too early for
  #    JS-heavy SERPs. The shim injects networkidle2 for configured search
  #    hosts and load for ordinary web pages.
  #
  # 2. STEALTH_JS stripping — CRW unconditionally injects its own stealth
  #    script via Page.addScriptToEvaluateOnNewDocument with Mac-specific
  #    WebGL strings that conflict with obscura's Linux platform. The shim
  #    replaces the script source with a no-op, letting obscura's own
  #    --stealth mode handle fingerprinting without conflict.
  #
  # 3. proxyServer stripping safety net — if CRW is ever configured with a
  #    crawler proxy that creates a per-request CDP browser context, the shim
  #    strips proxyServer so browser traffic uses obscura's own --proxy path.
  #
  # CRW connects to ws://127.0.0.1:9224/devtools/browser (the shim) instead
  # of ws://127.0.0.1:9222/devtools/browser (obscura directly). The shim
  # proxies all CDP traffic transparently except for the intercepted methods.
  #
  # See crw/cdp_shim.py for the implementation. No build step — the script is
  # bind-mounted into a stock python:3.12-slim image and deps are pip-installed
  # at container start (same pattern as onyx/local_embedding_shim.py in
  # docker-compose.full.yml).
  cdp-shim:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    network_mode: "service:netns-holder"
    environment:
      CDP_SHIM_HOST: "0.0.0.0"
      CDP_SHIM_PORT: "9224"
      OBSCURA_CDP_URL: "ws://127.0.0.1:9222/devtools/browser"
      # Strip CRW's STEALTH_JS (1 = yes, 0 = no).
      CDP_SHIM_STRIP_STEALTH_JS: "1"
      CDP_SHIM_LOG_LEVEL: "info"
      # Per-URL waitUntil injection into Page.navigate calls.
      # Search engine URLs (SERPs) use networkidle2 (≤2 active connections
      # for 500ms) — SERPs are JS-heavy SPAs that load results via XHR.
      # All other URLs (open_url web pages) use "load" (all subresources
      # finished) — content is ready at load, and many modern sites keep
      # long-polling connections that prevent network idle.
      #
      # Obscura lifecycle event firing order (each implies the previous):
      #   1. domcontentloaded  — DOM parsed + scripts executed
      #   2. load              — all subresources finished, onload fired
      #   3. networkidle2      — ≤2 active network requests for 500ms
      #   4. networkidle0     — 0 active network requests for 500ms
      OBSCURA_WAIT_UNTIL_SEARCH: "${OBSCURA_WAIT_UNTIL_SEARCH:-networkidle2}"
      OBSCURA_WAIT_UNTIL_DEFAULT: "${OBSCURA_WAIT_UNTIL_DEFAULT:-load}"
      OBSCURA_WAIT_UNTIL_SEARCH_HOSTS: "${OBSCURA_WAIT_UNTIL_SEARCH_HOSTS:-google.com,search.brave.com,html.duckduckgo.com,startpage.com}"
      # Interval for periodic cookie clearing on obscura (seconds). In the
      # normal wrapper path CRW uses Target.createTarget on obscura's default
      # context, so cookies can persist between CDP WebSocket connections.
      # If a per-request Target.createBrowserContext path is introduced,
      # obscura v0.1.9 clears the default jar on create/dispose. Default: 3600
      # (60 min). Set to 0 to disable.
      OBSCURA_CLEAR_COOKIES_INTERVAL: "${OBSCURA_CLEAR_COOKIES_INTERVAL:-3600}"
    volumes:
      - ./crw/cdp_shim.py:/app/cdp_shim.py:ro
    # Install websockets at startup, then run the shim.
    # pip install takes ~2-3s on first start; the healthcheck start_period
    # accommodates this. Only the websockets library is needed — the shim
    # uses stdlib for everything else (urllib.parse for hostname extraction).
    command:
      - /bin/sh
      - -c
      - |
        pip install --no-cache-dir --quiet 'websockets>=12.0,<14' && \
        exec python -u /app/cdp_shim.py
    healthcheck:
      # The shim is a Python websockets server. Use a raw TCP connect to
      # check the port is listening. The websockets library will log a 400
      # for this (it's not a valid WebSocket handshake), but that's harmless
      # — the shim suppresses the log for connections that don't send a
      # valid HTTP upgrade. We can't use websockets.connect() here because
      # pip install happens in the command, not in the healthcheck's env.
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 9224)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      netns-holder:
        condition: service_started
      obscura:
        condition: service_healthy

  # Prefetch-blocking HTTP proxy for CRW.
  #
  # CRW unconditionally sends a bare reqwest GET (non-browser TLS fingerprint,
  # no JS) to every target URL before escalating to obscura's stealth CDP
  # browser. For anti-bot-protected search engines, this double-hit from the
  # same IP — first with a non-browser TLS fingerprint — is a strong bot
  # detection signal and a primary cause of 429s.
  #
  # This proxy intercepts CRW's HTTP prefetch requests:
  #  - Search engine URLs → 403 immediately (no network request)
  #  - Other URLs → HEAD check → PDF? tunnel GET : 403
  #
  # CRW is configured with HTTP_PROXY/HTTPS_PROXY pointing at this proxy. We
  # intentionally do not set CRW_CRAWLER__PROXY; if that path is used later,
  # the CDP shim strips proxyServer from Target.createBrowserContext so
  # obscura uses its own --proxy flag, not this proxy.
  #
  # When PROXY_URL is set (e.g., Tor SOCKS proxy), this proxy routes its own
  # upstream requests (HEAD and tunnel) through PROXY_URL, ensuring the HEAD
  # request and PDF tunnel egress through the same proxy as obscura.
  #
  # See crw/prefetch_blocking_proxy.py for the implementation and
  # docs/request_handling.md §1.7 for the design.
  prefetch-blocking-proxy:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    network_mode: "service:netns-holder"
    environment:
      PREFETCH_PROXY_HOST: "0.0.0.0"
      PREFETCH_PROXY_PORT: "3128"
      PREFETCH_PROXY_LOG_LEVEL: "${PREFETCH_PROXY_LOG_LEVEL:-info}"
      # Upstream proxy (PROXY_URL from .env.wrapper). When set, the proxy
      # routes its own HEAD and tunnel requests through this upstream.
      # Supports http://, https://, socks5://, socks5h://
      PROXY_URL: "${PROXY_URL:-}"
      # Comma-separated list of search engine hostnames to block immediately
      # (return 403 without any network request).
      PREFETCH_BLOCK_HOSTS: "${PREFETCH_BLOCK_HOSTS:-google.com,search.brave.com,html.duckduckgo.com,startpage.com}"
    volumes:
      - ./crw/prefetch_blocking_proxy.py:/app/prefetch_blocking_proxy.py:ro
    command:
      - /bin/sh
      - -c
      - |
        exec python -u /app/prefetch_blocking_proxy.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 3128)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      netns-holder:
        condition: service_started

  # Firecrawl-compatible API server. Configured entirely via CRW_* env vars
  # (no config file mount needed — env layer wins over the baked-in
  # config.default.toml). CRW_SERVER__PORT moves it off 3000 (taken by
  # web_server in the shared netns). CRW_RENDERER__CHROME__WS_URL points at
  # the CDP shim (port 9224), which proxies to obscura (port 9222);
  # CRW_SEARCH__SEARXNG_URL points /v1/search at the wrapper's bundled
  # SearXNG sidecar (127.0.0.1:8888 in the netns).
  crw:
    image: ${CRW_IMAGE:-ghcr.io/us/crw:0.18.3}
    restart: unless-stopped
    network_mode: "service:netns-holder"
    environment:
      RUST_LOG: "info"
      # Override the baked-in config.default.toml via env vars (highest precedence).
      # Move crw off port 3000 (taken by web_server in the shared netns).
      CRW_SERVER__PORT: "3010"
      # Constrain CRW's JS renderer ladder to the chrome tier, which points at
      # obscura through the CDP shim. This does not force every request directly
      # to CDP: with render_js_default unset, CRW still performs its HTTP
      # prefetch first, then escalates to chrome/obscura when the prefetch is
      # blocked, thin, or JS-required.
      CRW_RENDERER__MODE: "chrome"
      # Auto mode (render_js_default unset): CRW runs an HTTP prefetch first,
      # then escalates to the CDP renderer (obscura) when the prefetch returns
      # an error or a 403/blocked status. The prefetch-blocking proxy
      # (prefetch-blocking-proxy service on port 3128) intercepts the HTTP
      # prefetch and returns 403 for all non-PDF URLs, forcing CRW to escalate
      # to obscura for every page. PDFs are detected by the proxy and returned
      # to CRW for pdf_inspector processing.
      #
      # We do NOT set render_js_default=true because that mode runs the HTTP
      # prefetch unconditionally and does NOT escalate to CDP on prefetch
      # failure (the ? operator propagates the error). Auto mode does escalate
      # on failure/403, which is what we need.
      # CRW_RENDERER__RENDER_JS_DEFAULT is intentionally unset.
      # Point the chrome renderer at the CDP shim (port 9224), not obscura
      # directly (port 9222). The shim strips CRW's conflicting STEALTH_JS
      # injection, injects per-URL waitUntil into Page.navigate, and strips
      # proxyServer if a future CRW_CRAWLER__PROXY path creates a per-request
      # browser context.
      # The /devtools/ path makes crw skip /json/version discovery and
      # connect directly.
      CRW_RENDERER__CHROME__WS_URL: "ws://127.0.0.1:9224/devtools/browser"
      # Route CRW's HTTP prefetch through the prefetch-blocking proxy via
      # reqwest's env-var proxy support (HTTPS_PROXY/HTTP_PROXY). We do NOT
      # use CRW_CRAWLER__PROXY because that sets REQUEST_PROXY, which causes
      # CRW to include proxyServer in Target.createBrowserContext with a
      # hardcoded 2-second timeout. On Tor/slow paths, createBrowserContext
      # takes >2s → "Timeout after 2000ms" → 504. Using env-var proxies
      # routes the HTTP prefetch through the blocking proxy without setting
      # REQUEST_PROXY, so the CDP path uses the no-proxy fetcher (no
      # proxyServer in createBrowserContext, no 2s timeout).
      #
      # The proxy returns 403 for search engine URLs and non-PDF URLs,
      # forcing CRW to escalate to the CDP renderer (obscura). PDFs are
      # detected by the proxy and returned for CRW's pdf_inspector.
      HTTPS_PROXY: "http://127.0.0.1:3128"
      HTTP_PROXY: "http://127.0.0.1:3128"
      # Exclude loopback from the proxy so CRW's CDP WebSocket connection
      # to the shim (ws://127.0.0.1:9224) and health check (127.0.0.1:3010)
      # go direct. The CDP connection uses the websockets crate (not
      # reqwest), so HTTPS_PROXY doesn't affect it, but NO_PROXY is set
      # for completeness.
      NO_PROXY: "127.0.0.1,localhost,::1"
      # Per-page navigation timeout for the chrome (obscura) renderer tier.
      # CRW's default page_timeout_ms is 30s, but when PROXY_URL routes
      # through Tor or a slow VPN, obscura's waitUntil=networkidle2 can
      # take up to 45s (OBSCURA_NAV_TIMEOUT_MS). This must be ≥
      # OBSCURA_NAV_TIMEOUT_MS so CRW's page_timeout doesn't fire before
      # obscura's nav timeout. Set to 50000 to give 5s of headroom.
      CRW_RENDERER__CHROME_TIMEOUT_MS: "${CRW_RENDERER__CHROME_TIMEOUT_MS:-50000}"
      # HTTP prefetch timeout. CRW always runs an HTTP prefetch before the
      # CDP renderer (even with RENDER_JS_DEFAULT=true) to check Content-Type
      # — PDFs (application/pdf) bypass obscura entirely and are handled by
      # CRW's pdf_inspector. On the happy path the prefetch completes in 1-3s;
      # this is a ceiling, not a delay. Increasing it from the default 30s to
      # 60s raises CRW's effective per-request deadline (ladder_min) from
      # ~108s to ~138s, giving queued requests in the per-host rate limiter
      # more budget before their deadline expires. No happy-path impact.
      CRW_RENDERER__HTTP_TIMEOUT_MS: "${CRW_RENDERER__HTTP_TIMEOUT_MS:-60000}"
      # Baseline per-request deadline (ms). With auto_extend_deadline_for_ladder
      # (default true), the effective deadline is max(this, ladder_min). Since
      # ladder_min=~138s, setting this to 300000 (5 min) makes it the effective
      # deadline instead, accommodating multi-request scenarios where the agent
      # issues many parallel open_url or search queries. This gives queued
      # requests in the per-host rate limiter (PER_HOST_MAX_CONCURRENT=1) enough
      # deadline budget to complete after waiting behind earlier requests, while
      # still serializing per-host to avoid 429s. No happy-path impact — fast
      # pages complete in ~1-5s regardless. The Tower outer timeout auto-widens
      # to cover this. See docs/request_handling.md §1.6.1.
      CRW_REQUEST__DEADLINE_MS_DEFAULT: "${CRW_REQUEST__DEADLINE_MS_DEFAULT:-300000}"
      # Post-navigate budget for the chrome (obscura) renderer tier.
      # This is the inner race that wraps wait_for_page_ready +
      # post_navigate_phase (SPA selector poll, content stability, challenge
      # retry). CRW's default is 12000ms (calibrated as p90 of successful
      # renders on fast networks), but on Tor/slow VPN, obscura's navigation
      # alone can take 20-40s. When this budget fires before the page loads,
      # CRW returns "Timeout after 12000ms" → 504 Gateway Timeout.
      # Set to 48000 (just under OBSCURA_NAV_TIMEOUT_MS=45000 + overhead)
      # so the nav budget doesn't fire before obscura's adaptive waitUntil
      # has a chance to complete.
      CRW_RENDERER__CHROME_NAV_BUDGET_MS: "${CRW_RENDERER__CHROME_NAV_BUDGET_MS:-48000}"
      # /v1/search backed by the wrapper's bundled SearXNG sidecar.
      CRW_SEARCH__SEARXNG_URL: "http://127.0.0.1:8888"
      # ── Per-host rate limiting (anti-429) ──────────────────────────────
      # CRW's host_limiter (crates/crw-renderer/src/host_limiter.rs) enforces
      # a minimum interval between requests to the same eTLD+1. The
      # FallbackRenderer (which handles /v1/scrape from SearXNG engines)
      # uses crawler.requests_per_second to compute the per-host interval
      # (interval = 1/rps). The default 10 RPS = 100ms interval, which lets
      # SearXNG's parallel engine fan-out hit Google/Brave/DDG/Startpage
      # nearly simultaneously from the same VPN IP and trigger 429s.
      # 0.33 RPS = ~3s interval between requests to the same eTLD+1,
      # serializing the burst that Onyx's parallel web_search queries create.
      # Keyed by eTLD+1 so www.google.com and google.com share one limiter.
      CRW_CRAWLER__REQUESTS_PER_SECOND: "0.33"
      # Cap concurrent in-flight requests per host at 1 (this is already the
      # default, but set explicitly). Combined with the RPS limit above,
      # this fully serializes per-provider requests: the host_limiter
      # semaphore is acquired before the fetch and held until the CDP render
      # completes, so a second query to the same engine waits for the first.
      #
      # Deadline compounding: the semaphore blocks queued requests while
      # their per-request deadline clock keeps ticking. On Tor/slow VPN
      # where a single nav takes ~45s, the 3rd request to the same engine
      # in a parallel fan-out (e.g. 3 search queries → 3 Google requests)
      # will have most of its ~108s deadline consumed by the time it
      # acquires the semaphore, leaving insufficient nav budget. This is
      # acceptable — SearXNG aggregates partial results from engines that
      # succeed. See docs/request_handling.md §1.6.1.
      CRW_CRAWLER__PER_HOST_MAX_CONCURRENT: "1"
      # Add ±20% jitter to the rate-limit interval so request timing doesn't
      # look mechanically regular (a bot signal in itself). This is the
      # stealth jitter_factor applied to the per-host limiter sleep in the
      # crawl loop. (The scrape path does not yet apply jitter — see CRW
      # lib.rs fetch(); the jitter is consumed by crw-crawl and crw-monitor.)
      CRW_CRAWLER__STEALTH__JITTER_FACTOR: "0.2"
    healthcheck:
      # The crw image (debian:bookworm-slim) has no wget/curl, but has
      # /bin/sh + grep + the crw CLI. We scrape the server's own /health
      # endpoint via the crw binary and grep for the status field. The crw
      # CLI always exits 0, so the grep exit code is the real signal: when
      # the server is down, the scrape produces no stdout (connection refused)
      # and grep fails; when up, /health returns {"status":"ok",...}.
      test: ["CMD-SHELL", "crw scrape http://127.0.0.1:3010/health --format json 2>/dev/null | grep -q status || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      obscura:
        condition: service_healthy
      cdp-shim:
        condition: service_healthy

  # Host-facing TCP bridges. These run on the normal compose network and
  # forward host traffic to services inside the shared netns-holder namespace
  # (reachable through the myst-client alias on the default network).
  host-web-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:3000,fork,reuseaddr tcp-connect:myst-client:80
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_started
        restart: true

  host-searxng-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${SEARXNG_CONTAINER_PORT:-8888},fork,reuseaddr tcp-connect:myst-client:${SEARXNG_CONTAINER_PORT:-8888}
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_CONTAINER_PORT:-8888}
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_started
        restart: true

  # Restarts containers marked with autoheal=true when Docker health is unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      myst-client:
        condition: service_started

  # Optional Tailscale Funnel bridge for exposing the Onyx WebUI publicly.
  # Default: stays on the default compose network so it does not inherit
  # Myst VPN routing from netns-holder (keeps Tailscale identity separate
  # from the VPN exit IP).
  # Set TAILSCALE_VPN_ROUTED=true in .env.wrapper to route Tailscale through
  # the Mysterium VPN namespace (applies docker-compose.tailscale-vpn.yml
  # via Makefile layering).
  tailscale-funnel:
    image: tailscale/tailscale:stable
    entrypoint: ["/usr/local/bin/tailscale-entrypoint.sh"]
    restart: unless-stopped
    environment:
      TAILSCALE_FUNNEL_ENABLED: "${TAILSCALE_FUNNEL_ENABLED:-false}"
      TAILSCALE_FUNNEL_TARGET_HOST: "host-web-proxy"
      TAILSCALE_FUNNEL_TARGET_PORT: "3000"
      TAILSCALE_FUNNEL_HTTPS_PORT: "443"
      TS_AUTHKEY: "${TAILSCALE_AUTHKEY:-}"
      TS_HOSTNAME: "${TAILSCALE_HOSTNAME:-onyx-funnel}"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "true"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_EXTRA_ARGS: "${TAILSCALE_EXTRA_ARGS:-}"
    volumes:
      - ./docker-data/tailscale:/var/lib/tailscale
      - ./tailscale/entrypoint.sh:/usr/local/bin/tailscale-entrypoint.sh:ro
    depends_on:
      host-web-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "enabled=$$(printf '%s' \"$${TAILSCALE_FUNNEL_ENABLED:-false}\" | tr '[:upper:]' '[:lower:]'); if [ \"$$enabled\" != \"1\" ] && [ \"$$enabled\" != \"true\" ] && [ \"$$enabled\" != \"yes\" ] && [ \"$$enabled\" != \"on\" ]; then exit 0; fi; tailscale status >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Onyx app tier (routed through the shared netns-holder namespace)
  api_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: api_server
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:netns-holder"
    environment:
      # code-interpreter runs on 7000 in the shared netns (8000 is taken by background prometheus).
      CODE_INTERPRETER_BASE_URL: "http://localhost:7000"
      # Generated by the Makefile for each stack start. Existing auth cookies,
      # password-reset tokens, and email-verification tokens expire on restart.
      USER_AUTH_SECRET: "${USER_AUTH_SECRET:?USER_AUTH_SECRET must be set}"
      # Generated by the Makefile for each full-mode stack start. In lite mode
      # FILE_STORE_BACKEND=postgres, so these values are unused.
      S3_AWS_ACCESS_KEY_ID: "${S3_AWS_ACCESS_KEY_ID:?S3_AWS_ACCESS_KEY_ID must be set}"
      S3_AWS_SECRET_ACCESS_KEY: "${S3_AWS_SECRET_ACCESS_KEY:?S3_AWS_SECRET_ACCESS_KEY must be set}"
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      # Controls Web connector SSRF-style URL checks.
      OPEN_URL_VALIDATE_SSRF: ${OPEN_URL_VALIDATE_SSRF:-}
      MCP_SERVER_ALLOW_PRIVATE_NETWORK: ${MCP_SERVER_ALLOW_PRIVATE_NETWORK:-}
      MCP_SERVER_ALLOW_LOOPBACK: ${MCP_SERVER_ALLOW_LOOPBACK:-}
      # Wrapper-level alias for Onyx's asymmetric query prefix setting.
      ASYM_QUERY_PREFIX: "${ONYX_EMBEDDING_QUERY_PREFIX:-}"
      # Interactive chat + deep-research tool-call loop cap (per request); we want long research capability
      MAX_LLM_CYCLES: "${MAX_LLM_CYCLES:-200}"
      # Optional wrapper-level overrides for open_url content truncation.
      # Leave empty to use Onyx defaults.
      OPEN_URL_MAX_CHARS_PER_URL: "${OPEN_URL_MAX_CHARS_PER_URL:-}"
      OPEN_URL_MAX_CHARS_ACROSS_URLS: "${OPEN_URL_MAX_CHARS_ACROSS_URLS:-}"
      # Fail startup if wrapper monkey patches no longer match upstream Onyx.
      WRAPPER_PATCH_STRICT: "${WRAPPER_PATCH_STRICT:-true}"
      # Page load waiting is handled by the CDP shim's waitUntil injection
      # (OBSCURA_WAIT_UNTIL_DEFAULT=load for web pages), not by a CRW
      # waitFor sleep. The sitecustomize patch ensures FirecrawlClient
      # omits waitFor from
      # /v2/scrape payloads. See docs/request_handling.md §1.6.
      # Base wrapper sitecustomize patches (applies to full and lite compose).
      PYTHONPATH: "/app/wrapper-patches-base:${PYTHONPATH:-}"
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    # Full-mode shim + tokenizer bootstrap can exceed upstream healthcheck grace.
    # Give API startup enough time so autoheal does not recycle it mid-init.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 240s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      # crw (Firecrawl-compatible scraper) is optional for Onyx, but wiring
      # the dependency avoids a first-request race if Onyx's Web Search
      # connector is configured to point at crw's /v1/scrape endpoint.
      crw:
        condition: service_started
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - ./docker-data/model-cache:/app/.cache/huggingface
      - ./docker-data/model-cache:/root/.cache/huggingface
      - ./onyx/patches/sitecustomize_base:/app/wrapper-patches-base:ro
      - api_server_logs:/var/log/onyx

  web_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: web_server
    image: onyxdotapp/onyx-web-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:netns-holder"
    environment:
      # Disable frontend analytics/instrumentation and cloud billing flows.
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
      # Minimum password length enforced by the backend and surfaced in the UI.
      PASSWORD_MIN_LENGTH: "8"
    # In shared netns mode, Next.js may bind eth0 only (not loopback), so
    # healthcheck probes the namespace IP instead of 127.0.0.1.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ip=$$(hostname -i | awk '{print $1}'); wget -q -T 5 -O /dev/null http://$$ip:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  nginx:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: nginx
    network_mode: "service:netns-holder"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports: !reset []
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  code-interpreter:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: code-interpreter
    image: onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:?CODE_INTERPRETER_IMAGE_TAG must be set}
    network_mode: "service:netns-holder"
    # Port 8000 is occupied in the shared myst netns by background's Prometheus
    # metrics server (hardcoded start_http_server(8000) in slack/listener.py).
    # Redirect code-interpreter to 7000 and point api_server/background at it.
    environment:
      PORT: "7000"
      CODE_INTERPRETER_BASE_URL: "http://localhost:7000"
      # Executor pod resource limits (defaults are tight: 256MB RAM, 5s CPU,
      # 1MB output). Raise them for data analysis / matplotlib workloads.
      MEMORY_LIMIT_MB: "${CODE_INTERPRETER_MEMORY_LIMIT_MB:-512}"
      CPU_TIME_LIMIT_SEC: "${CODE_INTERPRETER_CPU_TIME_LIMIT_SEC:-60}"
      MAX_OUTPUT_BYTES: "${CODE_INTERPRETER_MAX_OUTPUT_BYTES:-20000000}"
      MAX_EXEC_TIMEOUT_MS: "${CODE_INTERPRETER_MAX_EXEC_TIMEOUT_MS:-120000}"
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  # Teep: private verified LLM inference proxy.
  # Default: runs on the default Docker network (no VPN). Teep traffic egresses
  # directly, and the port is published to the host directly.
  # Set TEEP_VPN_ROUTED=true in .env.wrapper to route teep through the Mysterium
  # VPN namespace (applies docker-compose.teep-vpn.yml via Makefile layering).
  teep:
    image: ${TEEP_IMAGE:-13rac1/teep:cacfa5ab2a4e8cc52ec8a2020a763f7306ad3438}
    restart: unless-stopped
    ports:
      - ${TEEP_HOST:+${TEEP_HOST}:}${TEEP_PORT:-8337}:${TEEP_CONTAINER_PORT:-8337}
    environment:
      TEEP_LISTEN_ADDR: "${TEEP_LISTEN_ADDR:-0.0.0.0:${TEEP_CONTAINER_PORT:-8337}}"
      TEEP_MAX_CONNS: "${TEEP_MAX_CONNS:-6}"
      TEEP_SERVE_FLAGS: "${TEEP_SERVE_FLAGS:-}"
      VENICE_API_KEY: "${VENICE_API_KEY:-}"
      TINFOIL_API_KEY: "${TINFOIL_API_KEY:-}"
      NEARAI_API_KEY: "${NEARAI_API_KEY:-}"
      CHUTES_API_KEY: "${CHUTES_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8337/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  relational_db:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: relational_db
    volumes: !override
      - ./docker-data/postgres:/var/lib/postgresql/data

volumes:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:
  obscura-data:
