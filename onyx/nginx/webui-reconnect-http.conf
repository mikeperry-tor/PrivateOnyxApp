# Preserve ordinary upstream compression, but request an identity response for
# HTML documents so nginx's sub_filter can inject the reconnect companion.
map $http_accept $private_onyx_webui_accept_encoding {
    default $http_accept_encoding;
    ~*text/html "";
}

# Preserve closing-head bytes for errors, API routes, and wrapper assets. The
# original request URI is used because the generated API location rewrites
# $uri before proxying.
map "$upstream_status:$request_uri:$upstream_http_content_disposition" $private_onyx_webui_head_replacement {
    default "</head>";
    ~*^2[0-9][0-9]:(?!/api(?:/|$)|/openapi[.]json(?:[?]|$)|/_private-onyx/)[^:]*:(?!attachment) '<script defer src="/_private-onyx/webui-reconnect.js" data-private-onyx-webui-reconnect></script></head>';
}
