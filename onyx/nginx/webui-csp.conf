# Browser-originated requests use the end user's network rather than the
# container egress proxies. Add a second CSP policy so it intersects with
# Onyx's own policy and restricts every browser-controlled resource class.
#
# The stock image's streamed Next.js bootstrap does not expose a working
# runtime nonce path. Inline script blocks are therefore required for WebUI
# hydration. Event-handler attributes remain independently denied below.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
