## Optional proxy-only executor network. Selected only when
## ONYX_CODE_INTERPRETER_ENABLE_NETWORK=true.

services:
  netns-holder:
    networks:
      executor-policy-upstream:
        aliases: [myst-client]

  # Enabled executors use the ordinary public policy. Caller networks remain
  # separate and host/RFC1918 exceptions remain unavailable.
  onyx-public-egress-proxy:
    environment:
      EGRESS_PROXY_ALLOWED_CLIENT_HOSTS: "onyx-public-egress-bridge,obscura-egress-bridge,executor-egress-bridge"

  executor-egress-bridge:
    image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    command: ["tcp-listen:3128,fork,reuseaddr", "tcp-connect:myst-client:3132"]
    networks: [executor-egress, executor-policy-upstream]
    depends_on:
      onyx-public-egress-proxy: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "printf 'CONNECT localhost:443 HTTP/1.1\r\nHost: localhost:443\r\n\r\n' | socat -T 3 STDIO,ignoreeof TCP:127.0.0.1:3128,connect-timeout=3 | grep -q '^HTTP/1.1 403'"]
      interval: 10m
      start_interval: 5s
      timeout: 5s
      retries: 1
      start_period: 30s

  code-interpreter:
    environment:
      ONYX_CODE_INTERPRETER_ENABLE_NETWORK: "true"
      PYTHON_EXECUTOR_DOCKER_NETWORK: "onyx-code-interpreter-executor"
      ONYX_AGENT_EXECUTOR_HTTP_PROXY_URL: "http://executor-egress-bridge:3128"
      ONYX_AGENT_EXECUTOR_NO_PROXY: "127.0.0.1,localhost,::1"
      WRAPPER_PATCH_STRICT: "true"
      PYTHONPATH: "/app/wrapper-patches:${PYTHONPATH:-}"
    volumes: !override
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./onyx/patches/sitecustomize_code_interpreter:/app/wrapper-patches:ro
    depends_on:
      executor-egress-bridge: {condition: service_healthy}

  api_server:
    environment:
      ONYX_CODE_INTERPRETER_ENABLE_NETWORK: "true"
      WRAPPER_PATCH_STRICT: "true"

networks:
  executor-egress:
    name: onyx-code-interpreter-executor
    internal: true
  executor-policy-upstream: {internal: true}
