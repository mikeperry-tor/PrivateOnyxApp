## Tailscale VPN routing override.
## Applied when TAILSCALE_FUNNEL_ROUTE_THROUGH_MYST_VPN=true in .env.wrapper
## (via Makefile COMPOSE_FILE layering). Moves tailscale-funnel into the
## shared netns-holder namespace so Tailscale traffic egresses through the
## Mysterium VPN tunnel. The Funnel process still reaches Onyx only through
## the fixed frontend gateway.
##
## WARNING: When this override is applied, your Tailscale identity becomes
## linked to the VPN exit IP address. The default (no override) uses the
## dedicated Tailscale uplink to avoid this linkage.

services:
  netns-holder:
    networks:
      tailscale-ingress: {}

  tailscale-funnel:
    # Join the trusted VPN namespace instead of the dedicated direct uplink.
    network_mode: "service:netns-holder"
    networks: !reset []
    environment:
      TAILSCALE_FUNNEL_TARGET_HOST: "tailscale-frontend-gateway"
      TAILSCALE_FUNNEL_TARGET_PORT: "8080"
    depends_on: !override
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      tailscale-frontend-gateway:
        condition: service_healthy
