## Podman full-mode override.
## Applied by `make up-full` (and `make down-full`) via COMPOSE_FILE layering
## when CONTAINER_BIN resolves to a podman binary.
##
## OpenSearch runs as uid/gid 1000 inside its container. macOS Podman exposes
## host binds through virtiofs with ownership that uid 1000 cannot safely
## change. This causes:
##   AccessDeniedException[/usr/share/opensearch/data/nodes]
##   OpenSearchException[failed to bind service]
##
## `:Z` changes the SELinux label but not uid/gid, and `:U` recursive chown is
## rejected by the macOS virtiofs share. Use an engine-native named volume
## rather than widening the host directory. Docker's bind data remains
## untouched. This override is full-mode only because the lite stack has no
## opensearch service.

services:
  background:
    depends_on:
      relational_db:
        condition: service_healthy

  opensearch:
    volumes: !override
      - podman-opensearch-data:/usr/share/opensearch/data

  # macOS cannot reliably re-export user-mounted filesystems such as WebDAV
  # through the Podman machine's virtiofs shares. The Makefile atomically
  # refreshes this native volume through the remote `podman cp` API before
  # Compose creates the full stack. The serving container remains read-only.
  doc-drop-web:
    volumes: !override
      - podman-rag-docs:/import:ro
      - ./onyx/doc_drop_webserver.py:/app/doc_drop_webserver.py:ro

volumes:
  podman-opensearch-data:
  podman-rag-docs:
    name: ${PODMAN_RAG_DOC_VOLUME:?PODMAN_RAG_DOC_VOLUME must be set}
    external: true
