## Teep VPN routing override.
## Applied when TEEP_ROUTE_THROUGH_MYST_VPN=true in .env.wrapper (via Makefile
## COMPOSE_FILE layering). Moves teep into the trusted netns-holder namespace
## so LLM API traffic egresses through the Mysterium VPN tunnel, and adds the
## host-teep-proxy socat bridge for host-side port access.
##
## When this override is NOT applied (default), teep uses onyx-teep plus its
## dedicated direct uplink, with direct port publishing and no VPN routing.

services:
  netns-holder:
    networks:
      teep-vpn-ingress:
        aliases: [myst-client]

  teep:
    # Join the trusted VPN namespace instead of the dedicated direct uplink.
    network_mode: "service:netns-holder"
    networks: !reset []
    # Remove direct port publishing — ports can't be published from a shared
    # netns. Host access is handled by host-teep-proxy below.
    ports: !reset []
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  teep-service-gateway:
    image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["tcp-listen:8337,fork,reuseaddr", "tcp-connect:myst-client:8337"]
    networks:
      onyx-teep:
        aliases: [teep]
      teep-vpn-ingress: {}
    depends_on:
      teep: {condition: service_healthy}

  # Host-facing TCP bridge for teep. Forwards host traffic to the teep port
  # inside the shared netns-holder namespace (reachable via the myst-client
  # alias on routing-uplink). This publisher has the same fixed-destination,
  # nonroot, read-only hardening as the other host edge publishers.
  host-teep-proxy:
    image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    command: ["tcp-listen:8337,fork,reuseaddr", "tcp-connect:myst-client:8337"]
    networks: [routing-uplink]
    ports:
      - ${TEEP_HOST:+${TEEP_HOST}:}${HOST_PORT_TEEP:-8337}:8337
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      teep:
        condition: service_healthy

networks:
  teep-vpn-ingress: {internal: true}
