## Full-mode override: local embedding shim and model-server routing
## Applied by `make up-full` via COMPOSE_FILE layering.

services:
  background:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: background
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    network_mode: "service:netns-holder"
    environment:
      # Generate with: openssl rand -hex 32
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:-CHANGE_ME_DEV_ONLY_SET_A_LONG_RANDOM_SECRET}
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_CELERY_TRACES_SAMPLE_RATE: "0"
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_SECRET_KEY: ""
      # Controls Web connector SSRF-style URL checks
      OPEN_URL_VALIDATE_SSRF: ${OPEN_URL_VALIDATE_SSRF:-}
      MCP_SERVER_ALLOW_PRIVATE_NETWORK: ${MCP_SERVER_ALLOW_PRIVATE_NETWORK:-}
      MCP_SERVER_ALLOW_LOOPBACK: ${MCP_SERVER_ALLOW_LOOPBACK:-}
      # Wrapper-level alias for Onyx's asymmetric query prefix setting.
      ASYM_QUERY_PREFIX: "${ONYX_EMBEDDING_QUERY_PREFIX:-}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-}"
      MODEL_SERVER_HOST: "127.0.0.1"
      MODEL_SERVER_PORT: "9101"
      INDEXING_MODEL_SERVER_HOST: "127.0.0.1"
      INDEXING_MODEL_SERVER_PORT: "9101"
      # code-interpreter runs on 7000 in the shared netns (8000 is taken by background prometheus).
      CODE_INTERPRETER_BASE_URL: "http://localhost:7000"
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      local-embedding-shim:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - ./docker-data/model-cache:/app/.cache/huggingface
      - ./docker-data/model-cache:/root/.cache/huggingface
      - background_logs:/var/log/onyx

  # Onyx internal/data services (full mode only)
  inference_model_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: inference_model_server
    image: onyxdotapp/onyx-model-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    environment:
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./docker-data/model-cache:/app/.cache/huggingface
      - inference_model_server_logs:/var/log/onyx

  indexing_model_server:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: indexing_model_server
    image: onyxdotapp/onyx-model-server:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    environment:
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./docker-data/indexing-model-cache:/app/.cache/huggingface
      - indexing_model_server_logs:/var/log/onyx

  opensearch:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: opensearch
    volumes: !override
      - ./docker-data/opensearch:/usr/share/opensearch/data

  cache:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: cache

  # Required by upstream Onyx service dependencies inherited via extends.
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  host-doc-drop-web-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:${DOC_DROP_WEB_PORT:-8091},fork,reuseaddr tcp-connect:myst-client:${DOC_DROP_WEB_CONTAINER_PORT:-8091}
    ports:
      - ${DOC_DROP_WEB_HOST:+${DOC_DROP_WEB_HOST}:}${DOC_DROP_WEB_PORT:-8091}:${DOC_DROP_WEB_CONTAINER_PORT:-8091}
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_started
        restart: true

  # Read-only HTTP view of DOC_DROP_DIR from inside the shared myst namespace.
  # Use with Onyx Web connector at http://localhost:${DOC_DROP_WEB_PORT:-8091}/
  # so source links stay host-clickable while crawler access remains local.
  doc-drop-web:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: "service:netns-holder"
    volumes:
      - ${DOC_DROP_DIR:-./doc-drop}:/import/docs:ro
    command:
      - python
      - -m
      - http.server
      - ${DOC_DROP_WEB_CONTAINER_PORT:-8091}
      - --bind
      - 0.0.0.0
      - --directory
      - /import/docs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:${DOC_DROP_WEB_CONTAINER_PORT:-8091}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true

  api_server:
    environment:
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-}"
      MODEL_SERVER_HOST: "127.0.0.1"
      MODEL_SERVER_PORT: "9101"
      INDEXING_MODEL_SERVER_HOST: "127.0.0.1"
      INDEXING_MODEL_SERVER_PORT: "9101"
    depends_on:
      local-embedding-shim:
        condition: service_healthy

  # Model-server-compatible embedding shim for local OpenAI-compatible
  # /v1/embeddings endpoints.
  local-embedding-shim:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: "service:netns-holder"
    environment:
      LOCAL_EMBEDDINGS_URL: "${LOCAL_EMBEDDINGS_URL:-http://host.docker.internal:1234/v1/embeddings}"
      LOCAL_EMBEDDING_API_KEY: "${LOCAL_EMBEDDING_API_KEY:-}"
      LOCAL_EMBEDDING_MODEL: "${LOCAL_EMBEDDING_MODEL:-}"
      SHIM_QUERY_PREFIX: "${ONYX_EMBEDDING_QUERY_PREFIX:-}"
      SHIM_PASSAGE_PREFIX: "${ONYX_EMBEDDING_PASSAGE_PREFIX:-}"
    volumes:
      - ./onyx/local_embedding_shim.py:/app/local_embedding_shim.py:ro
    command:
      - python
      - /app/local_embedding_shim.py
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:9101/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
