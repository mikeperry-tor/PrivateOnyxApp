## Full-mode override: local embedding shim and model-server routing
## Applied by `make up-full` via COMPOSE_FILE layering.

services:
  background:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: background
    image: onyxdotapp/onyx-backend:${ONYX_IMAGE_TAG:?ONYX_IMAGE_TAG must be set}
    build: !reset null
    networks: [onyx-backend, onyx-data, onyx-public-egress, onyx-host-egress, onyx-teep]
    # Use the same stack-owned internal-service bypasses as api_server.
    env_file:
      - path: ./onyx/helper-egress.env
        required: true
    environment:
      # Disable optional telemetry/analytics integrations from wrapper layer.
      DISABLE_TELEMETRY: "true"
      # Disable automatic third-party configuration/data-list fetches. Release
      # note polling remains enabled separately.
      AUTO_LLM_CONFIG_URL: ""
      DISPOSABLE_EMAIL_DOMAINS_URL: ""
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_CELERY_TRACES_SAMPLE_RATE: "0"
      BRAINTRUST_API_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_HOST: ""
      HUBSPOT_TRACKING_URL: ""
      POSTHOG_API_KEY: ""
      MARKETING_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_DEBUG_LOGS_ENABLED: "false"
      NEXT_PUBLIC_CLOUD_ENABLED: "false"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES: "false"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_GTM_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      CAPTCHA_ENABLED: "false"
      RECAPTCHA_ENTERPRISE_PROJECT_ID: ""
      RECAPTCHA_ENTERPRISE_API_KEY: ""
      RECAPTCHA_SITE_KEY: ""
      RECAPTCHA_HOSTNAME_ALLOWLIST: ""
      # Craft sandbox infrastructure is not part of this Compose wrapper.
      ENABLE_CRAFT: "false"
      ONYX_SLACK_BOT_ENABLED: "${ONYX_SLACK_BOT_ENABLED:-false}"
      ONYX_DISCORD_BOT_ENABLED: "${ONYX_DISCORD_BOT_ENABLED:-false}"
      PROMETHEUS_METRICS_ENABLED: "false"
      CELERY_WORKER_PRIMARY_CONCURRENCY: "2"
      CELERY_WORKER_LIGHT_CONCURRENCY: "4"
      CELERY_WORKER_HEAVY_CONCURRENCY: "2"
      CELERY_WORKER_DOCPROCESSING_CONCURRENCY: "2"
      CELERY_WORKER_USER_FILE_PROCESSING_CONCURRENCY: "1"
      CELERY_WORKER_DOCFETCHING_CONCURRENCY: "1"
      # Generated by the Makefile for each stack start. Existing auth cookies,
      # password-reset tokens, and email-verification tokens expire on restart.
      USER_AUTH_SECRET: "${USER_AUTH_SECRET:?USER_AUTH_SECRET must be set}"
      S3_AWS_ACCESS_KEY_ID: "${S3_AWS_ACCESS_KEY_ID:?S3_AWS_ACCESS_KEY_ID must be set}"
      S3_AWS_SECRET_ACCESS_KEY: "${S3_AWS_SECRET_ACCESS_KEY:?S3_AWS_SECRET_ACCESS_KEY must be set}"
      # Controls Web connector SSRF-style URL checks
      OPEN_URL_VALIDATE_SSRF: "true"
      MCP_SERVER_ALLOW_PRIVATE_NETWORK: "true"
      MCP_SERVER_ALLOW_LOOPBACK: "false"
      # Wrapper-level alias for Onyx's asymmetric query prefix setting.
      ASYM_QUERY_PREFIX: "${ONYX_RAG_EMBEDDING_QUERY_PREFIX:-}"
      EMBEDDING_BATCH_SIZE: "${ONYX_RAG_EMBEDDING_BATCH_SIZE:-}"
      MODEL_SERVER_HOST: "local-embedding-shim"
      MODEL_SERVER_PORT: "9101"
      INDEXING_MODEL_SERVER_HOST: "local-embedding-shim"
      INDEXING_MODEL_SERVER_PORT: "9101"
      WRAPPER_PATCH_STRICT: "true"
      PYTHONPATH: "/app/wrapper-patches-background:/app/wrapper-patches-shared:${PYTHONPATH:-}"
      ONYX_WEB_CONNECTOR_HTTP_FRESHNESS_ENABLED: "true"
      ONYX_WEB_CONNECTOR_HTTP_FRESHNESS_HOSTS: "doc-drop-web"
      ONYX_WEB_CONNECTOR_INTERNAL_BASE_URL: "http://doc-drop-web:8091/"
      ONYX_WEB_CONNECTOR_DISPLAY_BASE_URL: "http://localhost:${HOST_PORT_ONYX_RAG_DOC_WEB:-8091}/"
      CODE_INTERPRETER_BASE_URL: "http://code-interpreter:8000"
      # Route connector downloads and other environment-aware background HTTP
      # clients through the fixed public-only application bridge.
      HTTP_PROXY: "http://onyx-public-egress-bridge:3128"
      HTTPS_PROXY: "http://onyx-public-egress-bridge:3128"
      http_proxy: "http://onyx-public-egress-bridge:3128"
      https_proxy: "http://onyx-public-egress-bridge:3128"
      ONYX_HELPER_HTTP_PROXY_URL: "http://onyx-public-egress-bridge:3128"
      ONYX_MCP_PUBLIC_HTTP_PROXY_URL: "http://onyx-public-egress-bridge:3128"
      ONYX_MCP_HOST_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
      ONYX_WEB_CONNECTOR_PUBLIC_HTTP_PROXY_URL: "http://onyx-public-egress-bridge:3128"
      ONYX_WEB_CONNECTOR_HOST_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
      ONYX_CONFIGURED_INFERENCE_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
      ONYX_CONFIGURED_INFERENCE_INTERNAL_BASE_URL: "http://teep:8337/v1"
      CUSTOM_ANALYTICS_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
    extra_hosts: !reset []
    depends_on: !override
      cache:
        condition: service_started
      opensearch:
        condition: service_started
      relational_db:
        condition: service_started
      local-embedding-shim:
        condition: service_healthy
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - ./docker-data/model-cache:/app/.cache/huggingface
      - ./docker-data/model-cache:/root/.cache/huggingface
      # Upstream supervisord resets worker PYTHONPATH to /app. Mount the same
      # strict bootstrap and shared helper there so Celery workers and their
      # spawned indexing children cannot start without the wrapper patches.
      - ./onyx/patches/sitecustomize_background/sitecustomize.py:/app/sitecustomize.py:ro
      - ./onyx/patches/shared/wrapper_env_patches.py:/app/wrapper_env_patches.py:ro
      - ./onyx/patches/sitecustomize_background:/app/wrapper-patches-background:ro
      - ./onyx/patches/shared:/app/wrapper-patches-shared:ro
      - background_logs:/var/log/onyx
      - ./onyx/background_entrypoint.py:/app/wrapper-background-entrypoint.py:ro
      - ./onyx/beat_liveness_watchdog.py:/app/wrapper-beat-liveness-watchdog.py:ro
    entrypoint: ["python", "-S", "/app/wrapper-background-entrypoint.py"]
    command: []

  # Onyx internal/data services (full mode only)
  opensearch:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: opensearch
    volumes: !override
      - ./docker-data/opensearch:/usr/share/opensearch/data
    networks: [onyx-data]
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
    healthcheck: {disable: true}

  cache:
    extends:
      file: ./onyx/onyx_data/deployment/docker-compose.yml
      service: cache
    networks: [onyx-data]
    healthcheck: {disable: true}

  # Required by upstream Onyx service dependencies inherited via extends.
  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be set}
    restart: unless-stopped
    networks: [onyx-data]
    env_file:
      - path: ./onyx/onyx_data/deployment/.env
        required: true
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
      MINIO_SCANNER_SPEED: slowest
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10m
      start_interval: 5s
      timeout: 20s
      retries: 1
      start_period: 120s

  # Read-only internal crawl origin, reachable only through the fixed route
  # gateway or the separately published host view.
  doc-drop-web:
    image: ${PYTHON_ALPINE_IMAGE:?PYTHON_ALPINE_IMAGE must be set}
    restart: unless-stopped
    networks:
      doc-drop-route:
        aliases: [doc-drop-origin]
      doc-drop-publish: {}
    volumes:
      - ${ONYX_RAG_DOC_SOURCE_DIR:-./doc-drop}:/import/docs:ro
      - ./onyx/doc_drop_webserver.py:/app/doc_drop_webserver.py:ro
    command:
      - python
      - /app/doc_drop_webserver.py
      - "8091"
      - --bind
      - 0.0.0.0
      - --directory
      - /import/docs
    healthcheck: {disable: true}

  # The Web Connector always uses its selected request policy, including for
  # the stack-owned doc-drop origin. This fixed gateway exposes that origin
  # only on the host final-hop proxy path; it is not a general backend relay.
  doc-drop-route-gateway:
    image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    command: ["tcp-listen:8091,fork,reuseaddr", "tcp-connect:doc-drop-origin:8091"]
    networks:
      onyx-host-policy-upstream:
        aliases: [doc-drop-web]
      doc-drop-route: {}
    depends_on:
      doc-drop-web: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.0\r\nHost: doc-drop-web\r\n\r\n' | socat -T 5 STDIO,ignoreeof TCP:127.0.0.1:8091,connect-timeout=5 | grep -q '^HTTP/'"]
      interval: 10m
      start_interval: 5s
      timeout: 10s
      retries: 1
      start_period: 60s

  host-doc-display-publisher:
    image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    command: ["tcp-listen:8091,fork,reuseaddr", "tcp-connect:doc-drop-web:8091"]
    networks: [doc-drop-publish, host-publish]
    ports:
      - ${DOC_DROP_WEB_HOST:+${DOC_DROP_WEB_HOST}:}${HOST_PORT_ONYX_RAG_DOC_WEB:-8091}:8091
    depends_on:
      doc-drop-web: {condition: service_started}

  api_server:
    environment:
      EMBEDDING_BATCH_SIZE: "${ONYX_RAG_EMBEDDING_BATCH_SIZE:-}"
      # Optional internal_search/RAG character caps. Empty/0 means no wrapper
      # cap; Onyx's own section-count and selection behavior is left intact.
      ONYX_RAG_INTERNAL_SEARCH_MAX_CONTENT_CHARS_PER_RESULT: "${ONYX_RAG_INTERNAL_SEARCH_MAX_CONTENT_CHARS_PER_RESULT:-}"
      ONYX_RAG_INTERNAL_SEARCH_MAX_TOTAL_CONTENT_CHARS: "${ONYX_RAG_INTERNAL_SEARCH_MAX_TOTAL_CONTENT_CHARS:-}"
      MODEL_SERVER_HOST: "local-embedding-shim"
      MODEL_SERVER_PORT: "9101"
      INDEXING_MODEL_SERVER_HOST: "local-embedding-shim"
      INDEXING_MODEL_SERVER_PORT: "9101"
      WRAPPER_PATCH_STRICT: "true"
    depends_on: !override
      cache:
        condition: service_started
      local-embedding-shim:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
      opensearch:
        condition: service_started
      relational_db:
        condition: service_started

  # Model-server-compatible embedding shim for local OpenAI-compatible
  # /v1/embeddings endpoints.
  local-embedding-shim:
    image: ${PYTHON_ALPINE_IMAGE:?PYTHON_ALPINE_IMAGE must be set}
    restart: unless-stopped
    networks: [onyx-backend, onyx-host-egress]
    environment:
      ONYX_RAG_EMBEDDING_SHIM_UPSTREAM_URL: "${ONYX_RAG_EMBEDDING_SHIM_UPSTREAM_URL:-http://host.docker.internal:3210/v1/embeddings}"
      ONYX_RAG_EMBEDDING_SHIM_UPSTREAM_API_KEY: "${ONYX_RAG_EMBEDDING_SHIM_UPSTREAM_API_KEY:-}"
      ONYX_RAG_EMBEDDING_SHIM_UPSTREAM_MODEL: "${ONYX_RAG_EMBEDDING_SHIM_UPSTREAM_MODEL:-}"
      ONYX_RAG_EMBEDDING_MLX_SERVE_MODEL: "${ONYX_RAG_EMBEDDING_MLX_SERVE_MODEL:-majentik/harrier-oss-v1-0.6b-MLX-8bit}"
      SHIM_QUERY_PREFIX: "${ONYX_RAG_EMBEDDING_QUERY_PREFIX:-}"
      SHIM_PASSAGE_PREFIX: "${ONYX_RAG_EMBEDDING_PASSAGE_PREFIX:-}"
      ONYX_RAG_EMBEDDING_SHIM_HTTP_PROXY_URL: "http://onyx-host-egress-bridge:3128"
    volumes:
      - ./onyx/local_embedding_shim.py:/app/local_embedding_shim.py:ro
    command:
      - python
      - /app/local_embedding_shim.py
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:9101/health || exit 1"]
      interval: 10m
      start_interval: 5s
      timeout: 10s
      retries: 1
      start_period: 60s
    depends_on:
      onyx-host-egress-bridge:
        condition: service_healthy

networks:
  doc-drop-route: {internal: true}
  doc-drop-publish: {internal: true}
