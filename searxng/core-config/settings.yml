use_default_settings:
  engines:
    # No stock engine is used by this deployment. Keeping the inherited list
    # empty also prevents disabled engines from running startup initialization.
    keep_only: []

search:
  # Result formats available from the web endpoint; remove a format to deny
  # access. Onyx requires json (`format=json`); html is kept for diagnostics.
  formats:
    - html
    - json
  # Keep every blocking suspension equal to the provider browser-session idle
  # timeout so a blocked connection expires before SearXNG admits the provider
  # again.
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 3600

server:
  # Overwritten by the ephemeral SEARXNG_SECRET generated by the Makefile.
  secret_key: "DCIc01DEbGttdLWtTPdISq8fHrb99l"

outgoing:
  # Default timeout in seconds; engine entries can override it with `timeout`.
  request_timeout: 6.0

# This JSON/diagnostic deployment uses only the custom offline engines. An
# empty mapping prevents optional upstream plugins from being imported or
# initialized; setting a plugin's `active` preference false is insufficient
# because SearXNG still calls its init hook.
plugins: {}

engines:
  # Offline callbacks own their Obscura homepage/form transactions. The normal
  # SearXNG HTTP client is intentionally not involved. Bing may perform a
  # second bounded transaction for sparse first-page results.
  - name: google2
    engine: google2
    shortcut: go2
    timeout: 60.0
    disabled: false

  - name: brave2
    engine: brave2
    shortcut: br2
    timeout: 60.0
    disabled: false

  - name: duckduckgo2
    engine: duckduckgo2
    shortcut: ddg2
    timeout: 60.0
    disabled: false

  - name: startpage2
    engine: startpage2
    shortcut: sp2
    timeout: 60.0
    disabled: false

  - name: bing2
    engine: bing2
    shortcut: bi2
    timeout: 60.0
    disabled: false
    last_resort: true
    last_resort_fallback_weight: 0.05
    last_resort_confirmation_bonus: 0.15
