use_default_settings:
  engines:
    # Drop direct stock engines that are replaced by browser-backed rendered
    # variants below.
    remove:
      - google
      - google images
      - google news
      - google videos
      - brave
      - brave.images
      - brave.videos
      - brave.news
      - duckduckgo
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - duckduckgo web
      - startpage
      - startpage news
      - startpage images
      - bing

search:
  # Result formats available from the web endpoint; remove a format to deny
  # access. Onyx requires json (`format=json`); html is kept for diagnostics.
  formats:
    - html
    - json

server:
  # Overwritten by the ephemeral SEARXNG_SECRET generated by the Makefile.
  secret_key: "DCIc01DEbGttdLWtTPdISq8fHrb99l"

outgoing:
  # Default timeout in seconds; engine entries can override it with `timeout`.
  request_timeout: 6.0

engines:
  # Offline callbacks own one direct Obscura navigation. The normal SearXNG
  # HTTP client is intentionally not involved.
  - name: google2
    engine: google2
    shortcut: go2
    timeout: 60.0
    disabled: false

  - name: brave2
    engine: brave2
    shortcut: br2
    timeout: 60.0
    disabled: false

  - name: duckduckgo2
    engine: duckduckgo2
    shortcut: ddg2
    timeout: 60.0
    disabled: false

  - name: startpage2
    engine: startpage2
    shortcut: sp2
    timeout: 60.0
    disabled: false

  - name: bing2
    engine: bing2
    shortcut: bi2
    timeout: 60.0
    disabled: false
    last_resort: true
    last_resort_fallback_weight: 0.05
    last_resort_confirmation_bonus: 0.15
