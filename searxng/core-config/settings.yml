use_default_settings:
  engines:
    # Drop direct stock engines that are replaced by CRW-backed rendered
    # variants below.
    remove:
      - google
      - google images
      - google news
      - google videos
      - brave
      - brave.images
      - brave.videos
      - brave.news
      - duckduckgo
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - duckduckgo web
      - startpage
      - startpage news
      - startpage images

search:
  # Result formats available from the web endpoint; remove a format to deny
  # access. Onyx requires json (`format=json`); html is kept for diagnostics.
  formats:
    - html
    - json

server:
  # Is overwritten by the required ${SEARXNG_SECRET} from .env.wrapper.
  secret_key: "DCIc01DEbGttdLWtTPdISq8fHrb99l"

outgoing:
  # Default timeout in seconds; engine entries can override it with `timeout`.
  request_timeout: 6.0

engines:
  # CRW-backed rendered SERP engines. `enable_http: true` allows the SearXNG
  # HTTP client to POST to the local CRW endpoint on loopback.
  - name: google2
    engine: google2
    shortcut: go2
    timeout: 60.0
    disabled: false
    enable_http: true

  - name: brave2
    engine: brave2
    shortcut: br2
    timeout: 60.0
    disabled: false
    enable_http: true

  - name: duckduckgo2
    engine: duckduckgo2
    shortcut: ddg2
    timeout: 60.0
    disabled: false
    enable_http: true

  - name: startpage2
    engine: startpage2
    shortcut: sp2
    timeout: 60.0
    disabled: false
    enable_http: true
