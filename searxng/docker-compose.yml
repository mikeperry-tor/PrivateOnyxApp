# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_IMAGE_TAG:?SEARXNG_IMAGE_TAG must be set}
    restart: always
    env_file: ./.env
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      WRAPPER_PATCH_STRICT: "true"
      PYTHONPATH: "/usr/local/searxng/wrapper-patches:${PYTHONPATH:-}"
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
      - ./patches:/usr/local/searxng/wrapper-patches:ro
      # crw + obscura stealth-browser backed stub engines (see _crw.py).
      # Mounted as individual files to preserve the image's built-in engines.
      - ./engines/_crw.py:/usr/local/searxng/searx/engines/_crw.py:ro
      - ./engines/google2.py:/usr/local/searxng/searx/engines/google2.py:ro
      - ./engines/brave2.py:/usr/local/searxng/searx/engines/brave2.py:ro
      - ./engines/duckduckgo2.py:/usr/local/searxng/searx/engines/duckduckgo2.py:ro
      - ./engines/startpage2.py:/usr/local/searxng/searx/engines/startpage2.py:ro
      - ./engines/bing2.py:/usr/local/searxng/searx/engines/bing2.py:ro

  valkey:
    container_name: searxng-valkey
    image: ${VALKEY_IMAGE:?VALKEY_IMAGE must be set}
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
