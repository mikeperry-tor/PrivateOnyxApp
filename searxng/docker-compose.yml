# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: ${SEARXNG_WRAPPER_IMAGE:?SEARXNG_WRAPPER_IMAGE must be set}
    restart: always
    env_file: ./.env
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      SEARXNG_ROUND_ROBIN: "${SEARXNG_ROUND_ROBIN:-true}"
      WRAPPER_PATCH_STRICT: "true"
      PYTHONPATH: "/usr/local/searxng/wrapper-patches:${PYTHONPATH:-}"
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
      - ./patches:/usr/local/searxng/wrapper-patches:ro

volumes:
  core-data:
