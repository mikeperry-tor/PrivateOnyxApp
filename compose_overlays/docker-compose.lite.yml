## Lite-mode override for wrapper stack.
## Applied by `make up-lite` via COMPOSE_FILE layering.

services:
  api_server:
    # Replace inherited full-stack dependencies. Lite core startup does not
    # wait for optional browsing or outbound-route services; those features
    # fail closed when invoked while their path is unavailable.
    depends_on: !override {}
    environment:
      DISABLE_VECTOR_DB: "true"
      FILE_STORE_BACKEND: "postgres"
      CACHE_BACKEND: "postgres"
      AUTH_BACKEND: "postgres"
      USER_AUTH_SECRET: "${USER_AUTH_SECRET:?USER_AUTH_SECRET must be set}"
      WRAPPER_PATCH_STRICT: "true"
      PYTHONPATH: "/app/wrapper-patches-api:/app/wrapper-patches-shared:/app/obscura-client:${PYTHONPATH:-}"
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - api_server_logs:/var/log/onyx
      - ./onyx/patches/shared:/app/wrapper-patches-shared:ro
      - ./onyx/patches/sitecustomize_api_server:/app/wrapper-patches-api:ro
      - ./browser/obscura_client:/app/obscura-client:ro
