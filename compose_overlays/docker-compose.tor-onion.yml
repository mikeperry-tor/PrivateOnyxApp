services:
  tor:
    networks:
      tor-uplink: {}
      tor-ingress:
        ipv4_address: 10.253.247.2

  tor-frontend-gateway:
    image: ${BASE_IMAGE_REGISTRY:-docker.io}/library/nginx:1.25.5-alpine
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      tor-ingress:
        ipv4_address: 10.253.247.3
      onyx-frontend: {}
    volumes:
      - ./tor/frontend-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp
    depends_on:
      nginx: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null --header='Host: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.onion' http://127.0.0.1:8080/ || exit 1"]
      interval: 10m
      start_interval: 5s
      timeout: 10s
      retries: 1
      start_period: 60s

networks:
  tor-ingress:
    internal: true
    ipam:
      config:
        - subnet: 10.253.247.0/24
