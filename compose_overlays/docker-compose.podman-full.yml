## Podman full-mode override.
## Applied by `make up-full` (and `make down-full`) via COMPOSE_FILE layering
## when CONTAINER_BIN resolves to a podman binary.
##
## OpenSearch runs as uid/gid 1000 inside its container. macOS Podman exposes
## host binds through virtiofs with ownership that uid 1000 cannot safely
## change. This causes:
##   AccessDeniedException[/usr/share/opensearch/data/nodes]
##   OpenSearchException[failed to bind service]
##
## `:Z` changes the SELinux label but not uid/gid, and `:U` recursive chown is
## rejected by the macOS virtiofs share. Map the machine user to OpenSearch's
## uid/gid 1000 and retain the same initialized bind used by Docker Desktop.
## This override is full-mode only because lite has no opensearch service.

services:
  background:
    depends_on:
      relational_db:
        condition: service_healthy

  opensearch:
    userns_mode: "keep-id:uid=1000,gid=1000"
    # Rootless crun applies ping_group_range while creating the keep-id network
    # namespace. Only the OpenSearch group is mapped, so an inherited range
    # containing an unmapped group fails namespace creation.
    sysctls:
      net.ipv4.ping_group_range: "1000 1000"
    volumes: !override
      - ./docker-data/opensearch:/usr/share/opensearch/data

  # macOS cannot re-export user-mounted WebDAV filesystems through the Podman
  # machine's virtiofs shares. The Makefile runs the read-only document server
  # directly on host loopback; this hardened fixed-destination relay preserves
  # the internal doc-drop origin without copying the collection into the VM.
  doc-drop-web:
    image: ${SOCAT_IMAGE:?SOCAT_IMAGE must be set}
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: !reset []
    command: !override
      - tcp-listen:8091,fork,reuseaddr
      - tcp-connect:host.containers.internal:${PODMAN_DOC_SERVER_PORT:?PODMAN_DOC_SERVER_PORT must be set}
    networks: !override
      doc-drop-route:
        aliases: [doc-drop-origin]
      doc-drop-publish: {}
      podman-doc-host-uplink: {}

networks:
  # Only the capability-free fixed socat relay joins this non-internal edge.
  # Application containers retain no direct host or Internet route.
  podman-doc-host-uplink: {}
