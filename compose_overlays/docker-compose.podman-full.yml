## Podman full-mode override.
## Applied by `make up-full` (and `make down-full`) via COMPOSE_FILE layering
## when CONTAINER_BIN resolves to a podman binary.
##
## OpenSearch runs as uid/gid 1000 inside its container. macOS Podman exposes
## host binds through virtiofs with ownership that uid 1000 cannot safely
## change. This causes:
##   AccessDeniedException[/usr/share/opensearch/data/nodes]
##   OpenSearchException[failed to bind service]
##
## `:Z` changes the SELinux label but not uid/gid, and `:U` recursive chown is
## rejected by the macOS virtiofs share. Map the machine user to OpenSearch's
## uid/gid 1000 and retain the same initialized bind used by Docker Desktop.
## This override is full-mode only because lite has no opensearch service.

services:
  background:
    depends_on:
      relational_db:
        condition: service_healthy

  opensearch:
    userns_mode: "keep-id:uid=1000,gid=1000"
    # Rootless crun applies ping_group_range while creating the keep-id network
    # namespace. Only the OpenSearch group is mapped, so an inherited range
    # containing an unmapped group fails namespace creation.
    sysctls:
      net.ipv4.ping_group_range: "1000 1000"
    volumes: !override
      - ./docker-data/opensearch:/usr/share/opensearch/data
