services:
  # The Makefile creates Podman containers stopped, installs an exact native
  # startup health check from each retained regular check, verifies the 5s to
  # 10m/1m transition contract, and only then starts them. Compose rendering
  # start_interval is insufficient because Podman's compatibility API drops it.
  #
  # These services require a functional Docker daemon socket inside containers.
  # In podman machine mode on macOS, that socket path is not reliably usable.
  code-interpreter:
    profiles: ["requires-docker-socket"]

  # Docker's tmpfs uid=/gid= mount options are rejected by Podman. `U` asks
  # Podman to chown the new tmpfs to the container's configured 101:101 user;
  # the service remains non-root, read-only, capability-free, and no-new-privs.
  tailscale-frontend-gateway:
    tmpfs: !override
      - /var/cache/nginx:U,mode=0755
      - /var/run:U,mode=0755
      - /tmp

  # Reuse the same initialized bind as Docker Desktop. Map the machine user to
  # Alpine PostgreSQL's uid/gid 70 and bypass the image entrypoint because its
  # unconditional PGDATA chmod creates a root-owned virtiofs override and
  # immediately locks postgres out. `:Z` changes labels, not ownership, while
  # `:U` recursive chown is rejected by this macOS virtiofs path.
  relational_db:
    userns_mode: "keep-id:uid=70,gid=70"
    # Rootless crun can apply only groups present in this keep-id mapping.
    sysctls:
      net.ipv4.ping_group_range: "70 70"
    user: "70:70"
    entrypoint: ["postgres"]
    volumes: !override
      - ./docker-data/postgres:/var/lib/postgresql/data

  # Podman starts more concurrently than the Docker path and reports an exited
  # dependent immediately. Gate database consumers on the native startup check
  # so migrations never race PostgreSQL bind-mount initialization.
  api_server:
    depends_on:
      relational_db:
        condition: service_healthy

  # Native rootless Podman maps its exact engine-host aliases to this fixed
  # link-local gateway. Only the host policy may accept it, and only through
  # the existing exact-name plus configured-port checks.
  onyx-host-egress-proxy:
    environment:
      EGRESS_PODMAN_HOST_GATEWAY_IP: "169.254.1.2"
