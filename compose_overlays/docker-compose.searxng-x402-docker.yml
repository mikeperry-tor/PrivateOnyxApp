# Docker gateway isolation; Podman retains its documented host-reachability residual.
networks:
  searxng-x402-egress:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  searxng-x402-policy-upstream:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
