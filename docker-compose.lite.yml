## Lite-mode override for wrapper stack.
## Applied by `make up-lite` via COMPOSE_FILE layering.

services:
  api_server:
    depends_on: !reset
      myst-client:
        condition: service_healthy
    environment:
      DISABLE_VECTOR_DB: "true"
      FILE_STORE_BACKEND: "postgres"
      CACHE_BACKEND: "postgres"
      AUTH_BACKEND: "postgres"
      PYTHONPATH: "/app/wrapper-patches:${PYTHONPATH:-}"
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - api_server_logs:/var/log/onyx
      - ./onyx/patches/sitecustomize:/app/wrapper-patches:ro
