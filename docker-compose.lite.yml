## Lite-mode override for wrapper stack.
## Applied by `make up-lite` via COMPOSE_FILE layering.

services:
  api_server:
    # !override (not !reset) replaces the inherited upstream depends_on. The
    # upstream Onyx compose pulls in a dependency on `cache` via `extends`,
    # which only exists in full mode; overriding here drops it while keeping
    # netns-holder/myst-client/crw. (!reset collapses the mapping in this
    # compose version, so !override is used for a clean full replacement.)
    depends_on: !override
      netns-holder:
        condition: service_started
      myst-client:
        condition: service_healthy
        restart: true
      # crw (Firecrawl-compatible scraper) is optional for Onyx, but wiring
      # the dependency avoids a first-request race if Onyx's Web Search
      # connector is configured to point at crw's /v1/scrape endpoint.
      crw:
        condition: service_started
    environment:
      DISABLE_VECTOR_DB: "true"
      FILE_STORE_BACKEND: "postgres"
      CACHE_BACKEND: "postgres"
      AUTH_BACKEND: "postgres"
      PYTHONPATH: "/app/wrapper-patches:/app/wrapper-patches-base:${PYTHONPATH:-}"
    volumes: !override
      - ./docker-data/file-system:/app/file-system
      - api_server_logs:/var/log/onyx
      - ./onyx/patches/sitecustomize_base:/app/wrapper-patches-base:ro
      - ./onyx/patches/sitecustomize:/app/wrapper-patches:ro
