# ══════════════════════════════════════════════════════════════════════════════
# Mysterium Network — Client VPN Container
# ══════════════════════════════════════════════════════════════════════════════
#
# Runs a Mysterium dVPN *client* (consumer) node using the official
# mysteriumnetwork/myst image. It does NOT offer VPN services to the network;
# it only consumes them.
#
# ── FAIL-CLOSED CONFIGURATION ──────────────────────────────────────────────────
# This container is configured with strict fail-closed semantics:
# - Health check verifies tunnel is ACTIVE (Status: Connected), not just API up
# - Services depending on this container will not start until tunnel is established
# - Built-in kill-switch (firewall + outgoing rules) blocks traffic if tunnel drops
# - Shared-namespace containers inherit this protection and cannot bypass the VPN
#
# If tunnel cannot establish: check network configuration (NAT type, firewall, ISP)
# Current known issue: symmetric NAT at ISP level breaks Mysterium P2P tunneling.
#
# ── Sharing this network with other containers ────────────────────────────────
# Other Docker Compose services can route all their traffic through this
# container by setting:
#
#   network_mode: "container:myst-client-vpn"
#
# Those containers will share the network namespace of myst-client-vpn and
# inherit the Myst kill-switch: if the VPN tunnel drops, their traffic is
# blocked rather than falling back to the host network ("fail closed").
#
# ── Wallet / identity storage ─────────────────────────────────────────────────
# Wallet keys and node state are persisted via a bind mount:
#
#   ./myst-data  →  /var/lib/mysterium-node  (inside the container)
#   ./myst-data  →  /root/.mysterium         (inside the container)
#
# The keystore (Ethereum-compatible wallet files) lives under:
#   ./myst-data/keystore/
#
# Back up this directory to preserve your identity and any funded balance.
# On first start the container creates a new identity automatically if none
# exists in that directory.
#
# ── Startup sequence ──────────────────────────────────────────────────────────
# 1. Start the Myst daemon (TequilAPI on 127.0.0.1:4050).
# 2. Wait for TequilAPI to become reachable.
# 3. Create a new identity if none exists in the keystore.
# 4. Unlock the first identity found.
# 5. Register the identity on-chain if not already registered
#    (Mysterium sponsors gas fees — no ETH required from you).
#    During this phase Myst may log warnings like:
#      "Could not get consumer channel"
#      "no contract code at given address"
#    These are expected on first run before the consumer channel contract
#    exists, and stop after registration / funding completes.
# 6. Check balance; if zero, show/create a payment order and optionally
#    block until funded (see MYST_WAIT_FOR_FUNDS).
# 7. Attempt a VPN connection (if MYST_AUTO_CONNECT=true).
# 8. Keep the daemon in the foreground; kill-switch remains active.
#
# ── Docker Compose operations ────────────────────────────────────────────────
# Initialize / first start:
#   docker compose up -d
#
# Start an existing stopped container:
#   docker compose start
#
# Follow logs:
#   docker compose logs -f myst-client
#
# Stop the container without deleting state:
#   docker compose stop
#
# Restart after config changes:
#   docker compose up -d
#
# Rebuild / recreate the container:
#   docker compose up -d --force-recreate
#
# Delete the container but keep wallet/state in ./myst-data:
#   docker compose down
#
# Delete the container and local wallet/state data:
#   docker compose down
#   rm -rf ./myst-data
#
# ── Environment variables ─────────────────────────────────────────────────────
#
# Connection
#   MYST_AUTO_CONNECT        Connect on startup. Default: "true"
#   MYST_SERVICE_TYPE        VPN protocol. Default: "wireguard"
#   MYST_LOCATION_TYPE       Filter providers by node type.
#                            Values: residential | hosting | mobile
#                            Default: "residential"
#   MYST_COUNTRY             Optional ISO 3166-1 alpha-2 country code to
#                            restrict exit node selection (e.g. "US", "DE").
#                            Default: "" (any country)
#   MYST_PROVIDER_IDS        Comma-separated provider identity address(es) to
#                            pin to specific nodes (e.g. "0xABC...,0xDEF...").
#                            When set, --location-type and --country are still
#                            applied as secondary filters. Default: ""
#
# Registration
#   MYST_REFERRAL_TOKEN      Optional referral or affiliate token passed to
#                            `myst account register`. Default: ""
#   MYST_REGISTRATION_TIMEOUT
#                            Optional max seconds to wait for on-chain
#                            registration confirmation.
#                            Set to "0" (default) to wait indefinitely,
#                            which is recommended because confirmation time
#                            varies with blockchain/network conditions.
#   MYST_REGISTRATION_RETRY_INTERVAL
#                            Retry interval (seconds) for re-submitting
#                            `myst account register` while status remains
#                            unregistered/unknown. Default: "60"
#
# Funding / Order placement
#   The container uses `myst cli orders create` to place a crypto payment
#   order through a supported gateway. The gateway list is NOT hardcoded in
#   Myst CLI; it is returned at runtime by TequilAPI via `orders gateways`.
#   CoinGate is a known supported example, but it should be treated as an
#   example rather than the only guaranteed option. All four vars must be set
#   to trigger automatic order creation when balance is 0.
#
#   Helper commands:
#     ./print-order-gateways.sh
#     ./print-order-gateways.sh myst-client-vpn
#
#   MYST_ORDER_AMOUNT        MYST amount to purchase (e.g. "10").
#   MYST_ORDER_CURRENCY      Payment cryptocurrency (e.g. "BTC", "ETH", "USDT").
#                            Source of truth for currently enabled gateway /
#                            currency combinations:
#                              ./print-order-gateways.sh
#                            or:
#                              docker exec myst-client-vpn \
#                                myst cli orders gateways
#   MYST_ORDER_GATEWAY       Gateway name returned by `orders gateways`.
#                            `coingate` is a known example, not a guaranteed
#                            exhaustive list of options.
#   MYST_ORDER_COUNTRY       2-letter ISO country code used for tax calculation
#                            (e.g. "US").
#
#   On every start with a zero balance the container will also print any
#   existing pending orders (so you can track a previously placed order) and
#   list available gateways when order vars are not set.
#
#   MYST_WAIT_FOR_FUNDS      When "true", block the connection attempt and
#                            poll every 30 s until balance becomes non-zero.
#                            Useful when you want the container to self-heal
#                            after a top-up without a restart. Default: "false"
#
# ── Capabilities required ─────────────────────────────────────────────────────
# NET_ADMIN + /dev/net/tun are required for WireGuard tunnel management and
# the built-in kill-switch (iptables rules inside the container's netns).
# ══════════════════════════════════════════════════════════════════════════════

services:
  myst-client:
    image: ${MYST_CLIENT_IMAGE:-mysteriumnetwork/myst:docker_host_fixes_with_logs}
    container_name: myst-client-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - ./myst-data:/var/lib/mysterium-node
      - ./myst-data:/root/.mysterium
    environment:
      MYST_AUTO_CONNECT: "true"
      # Optional WireGuard interface MTU override passed to the daemon.
      MYST_WIREGUARD_MTU: ""
      # Diagnostic override to skip peer route exclusion during P2P setup.
      MYST_SKIP_PEER_ROUTE_EXCLUDE: "false"
      # Comma-separated hostnames that should bypass myst0 and stay on eth0.
      # Keep broker control-plane traffic on the pre-tunnel path to reduce
      # long-lived TCP resets during interface/route transitions.
      MYST_ROUTE_EXEMPT_HOSTS: "host.docker.internal,broker.mysterium.network"
      # Optional comma-separated IPv4 CIDRs to force through eth0.
      MYST_ROUTE_EXEMPT_CIDRS: ""
      MYST_SERVICE_TYPE: "${MYST_SERVICE_TYPE:-wireguard}"
      MYST_LOCATION_TYPE: "${MYST_LOCATION_TYPE:-residential}"
      MYST_COUNTRY: "${MYST_COUNTRY:-US}"
      MYST_PROVIDER_IDS: "${MYST_PROVIDER_IDS:-}"
      # Connection retry policy (helps with provider-specific transient failures).
      MYST_CONNECT_MAX_ATTEMPTS: "6"
      MYST_CONNECT_RETRY_INTERVAL: "5"
      # Max seconds allowed for each `myst connection up` command invocation.
      # Keep this large enough for successful fast paths while failing quickly on stalls.
      MYST_CONNECT_UP_TIMEOUT: "30"
      # Per-attempt wait budget for observing Connected state after `connection up`.
      MYST_CONNECT_STATUS_TIMEOUT: "15"
      MYSTERIUM_NODE_MODE: "consumer"
      MYST_NODE_MODE: "consumer"
      # Disable DNS updates when sharing network namespace with other containers
      MYST_SKIP_UPDATE_RESOLV_CONF: "true"
      # Legacy firewall-related toggle kept separate from NAT traversal bypasses.
      MYST_FIREWALL_DETECTION_ENABLED: "${MYST_FIREWALL_DETECTION_ENABLED:-true}"
      # Fail-closed: block traffic if connection drops
      MYST_FIREWALL_ENABLED: "true"
      # Optional referral/affiliate token used during identity registration.
      MYST_REFERRAL_TOKEN: ""
      # Optional max wait (seconds) for registration confirmation.
      # 0 means no timeout (wait indefinitely until registered).
      MYST_REGISTRATION_TIMEOUT: "5"
      # Re-submit registration every N seconds while still unregistered.
      MYST_REGISTRATION_RETRY_INTERVAL: "10"
      # Funding / order creation.
      # Set all four to automatically create a payment order when balance is 0.
      # Gateway names/currencies are discovered dynamically from Mysterium via:
      #   ./print-order-gateways.sh
      # or:
      #   docker exec myst-client-vpn myst cli orders gateways
      # CoinGate is a known example, but not the only possible gateway name.
      MYST_ORDER_AMOUNT: ""     # Amount of MYST to purchase (e.g. "10")
      MYST_ORDER_CURRENCY: ""   # Payment currency (e.g. "BTC", "ETH", "USDT")
      MYST_ORDER_GATEWAY: ""    # Payment gateway name from `orders gateways` (e.g. "coingate")
      MYST_ORDER_COUNTRY: ""    # 2-letter ISO country code for tax (e.g. "US")
      # Set to "true" to block startup until balance > 0 before attempting to connect.
      MYST_WAIT_FOR_FUNDS: "false"
    healthcheck:
      test: ["CMD-SHELL", "myst connection info 2>/dev/null | grep -Eiq '\"status\"[[:space:]]*:[[:space:]]*\"Connected\"|Status:[[:space:]]*Connected' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 4
      # Keep this above worst-case connect startup budget:
      # max_attempts * (connection_up_timeout + status_timeout) + retry_gaps.
      # With defaults: 6 * (30 + 15) + 5 * 5 = 295s.
      start_period: 420s
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu

        OS_DIR_DATA="/var/lib/mysterium-node"
        OS_DIR_RUN="/var/run/mysterium-node"
        OS_DIR_CONFIG="/etc/mysterium-node"
        MYST="myst --config-dir=$${OS_DIR_DATA} --script-dir=$${OS_DIR_CONFIG} --data-dir=$${OS_DIR_DATA} --runtime-dir=$${OS_DIR_RUN}"

        # Myst wireguard DNS manager invokes <script-dir>/update-resolv-conf on Unix.
        # In containerized namespace-sharing mode, keep DNS managed by Docker.
        if [ "$${MYST_SKIP_UPDATE_RESOLV_CONF:-false}" = "true" ]; then
          printf '%s\n' '#!/bin/sh' 'exit 0' > "$${OS_DIR_CONFIG}/update-resolv-conf"
          chmod +x "$${OS_DIR_CONFIG}/update-resolv-conf"
        fi

        # Start daemon in consumer-only mode (no provider services).
        # Disable LAN discovery to avoid mDNS/Bonjour conflicts in host-network tests.
        set -- --local-service-discovery=false --consumer
        if [ -n "$${MYST_WIREGUARD_MTU:-}" ]; then
          echo "Using WireGuard MTU override: $${MYST_WIREGUARD_MTU}"
          set -- "$@" --wireguard.mtu="$${MYST_WIREGUARD_MTU}"
        fi
        set -- "$@" daemon
        /usr/local/bin/docker-entrypoint.sh "$@" &
        svc_pid="$$!"

        apply_route_exemptions() {
          _gw="$$(ip -4 route show default 2>/dev/null | awk '/default/ {print $$3; exit}')"
          _dev="$$(ip -4 route show default 2>/dev/null | awk '/default/ {print $$5; exit}')"
          [ -n "$${_gw:-}" ] || return 0
          [ -n "$${_dev:-}" ] || return 0

          _hosts="$${MYST_ROUTE_EXEMPT_HOSTS:-}"
          if [ -n "$${_hosts}" ]; then
            OLDIFS="$$IFS"
            IFS=','
            for _host in $${_hosts}; do
              _host="$$(printf '%s' "$${_host}" | xargs)"
              [ -n "$${_host}" ] || continue
              _ips="$$(getent ahostsv4 "$${_host}" 2>/dev/null | awk '{print $$1}' | sort -u || true)"
              if [ -z "$${_ips}" ]; then
                echo "Route exemption: no IPv4 resolved for $${_host}"
                continue
              fi
              for _ip in $${_ips}; do
                ip route replace "$${_ip}"/32 via "$${_gw}" dev "$${_dev}" 2>/dev/null || true
                echo "Route exemption: host=$${_host} ip=$${_ip}/32 via=$${_gw} dev=$${_dev}"
              done
            done
            IFS="$$OLDIFS"
          fi

          _cidrs="$${MYST_ROUTE_EXEMPT_CIDRS:-}"
          if [ -n "$${_cidrs}" ]; then
            OLDIFS="$$IFS"
            IFS=','
            for _cidr in $${_cidrs}; do
              _cidr="$$(printf '%s' "$${_cidr}" | xargs)"
              [ -n "$${_cidr}" ] || continue
              ip route replace "$${_cidr}" via "$${_gw}" dev "$${_dev}" 2>/dev/null || true
              echo "Route exemption: cidr=$${_cidr} via=$${_gw} dev=$${_dev}"
            done
            IFS="$$OLDIFS"
          fi
        }

        (
          while true; do
            apply_route_exemptions
            sleep 20
          done
        ) &
        route_fix_pid="$$!"

        cleanup() {
          kill "$$route_fix_pid" 2>/dev/null || true
          kill "$$svc_pid" 2>/dev/null || true
          wait "$$route_fix_pid" 2>/dev/null || true
          wait "$$svc_pid" 2>/dev/null || true
        }
        trap cleanup INT TERM

        echo "Waiting for TequilAPI to be reachable..."
        # Wait for TequilAPI to be reachable (myst CLI uses TequilAPI on 127.0.0.1:4050).
        until $$MYST connection info >/dev/null 2>&1; do
          sleep 2
        done
        echo "TequilAPI is ready."

        IDS="$$($$MYST cli identities list 2>/dev/null | grep -Eo '0x[0-9a-fA-F]{40}' || true)"
        if [ -z "$$IDS" ]; then
          echo "No Myst identity found in /var/lib/mysterium-node; creating one."
          $$MYST cli identities new
          IDS="$$($$MYST cli identities list 2>/dev/null | grep -Eo '0x[0-9a-fA-F]{40}' || true)"
        fi

        ID="$$(printf '%s\n' "$$IDS" | head -n1)"
        if [ -n "$$ID" ]; then
          $$MYST cli identities unlock "$$ID" || true
        fi

        # ── Registration ─────────────────────────────────────────────────────────
        # Attempt on-chain registration (Mysterium sponsors gas for new identities).
        REG_STATUS="$$($$MYST cli identities get "$$ID" 2>/dev/null \
          | grep -i 'Registration Status' | grep -oE '[A-Za-z]+$' | tr '[:upper:]' '[:lower:]' || true)"

        if [ "$$REG_STATUS" != "registered" ]; then
          submit_registration() {
            if [ -n "$${MYST_REFERRAL_TOKEN:-}" ]; then
              if $$MYST account register --token="$${MYST_REFERRAL_TOKEN}"; then
                echo "Registration request submitted."
              else
                echo "WARNING: Failed to register the identity. Will retry while status remains unregistered."
              fi
            else
              if $$MYST account register; then
                echo "Registration request submitted."
              else
                echo "WARNING: Failed to register the identity. Will retry while status remains unregistered."
              fi
            fi
          }

          echo "Identity $$ID is not registered (status: $${REG_STATUS:-unknown}). Submitting registration..."
          submit_registration

          # Wait for registration to confirm on-chain.
          # Default is no timeout because confirmation timing depends on
          # transactor/Hermes availability and blockchain conditions.
          _timeout="$${MYST_REGISTRATION_TIMEOUT:-0}"
          _retry_interval="$${MYST_REGISTRATION_RETRY_INTERVAL:-60}"
          case "$$_retry_interval" in
            ''|0) _retry_interval=60 ;;
          esac
          REG_NEEDS_FUNDING=false
          _elapsed=0
          if [ "$$_timeout" = "0" ]; then
            echo "Waiting for registration to confirm on-chain (no timeout)."
            while true; do
              REG_STATUS="$$($$MYST cli identities get "$$ID" 2>/dev/null \
                | grep -i 'Registration Status' | grep -oE '[A-Za-z]+$' | tr '[:upper:]' '[:lower:]' || true)"
              echo "Registration status after $${_elapsed}s: $${REG_STATUS:-unknown}"
              [ "$$REG_STATUS" = "registered" ] && break

              # `inprogress` with zero balance means registration has started
              # but requires a payment-channel top-up to complete.
              if [ "$$REG_STATUS" = "inprogress" ]; then
                REG_BALANCE="$$($$MYST cli identities get "$$ID" 2>/dev/null \
                  | grep -i 'Balance:' | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1 || true)"
                case "$${REG_BALANCE:-0}" in
                  ''|0|0.0|0.00|0.000|0.0000|0.00000|0.000000)
                    echo "Registration is inprogress with zero balance; proceeding to funding/order creation."
                    REG_NEEDS_FUNDING=true
                    break
                  ;;
                esac
              fi

              if [ "$$_elapsed" -gt 0 ] && [ "$$(($$_elapsed % $$_retry_interval))" -eq 0 ]; then
                case "$${REG_STATUS:-unknown}" in
                  unregistered|registrationerror|unknown)
                    echo "Registration still $${REG_STATUS:-unknown} after $${_elapsed}s; re-submitting registration request..."
                    submit_registration
                  ;;
                esac
              fi
              sleep 5
              _elapsed="$$(($$_elapsed + 5))"
            done
          else
            echo "Waiting up to $${_timeout}s for registration to confirm on-chain..."
            while [ "$$_elapsed" -lt "$$_timeout" ]; do
              REG_STATUS="$$($$MYST cli identities get "$$ID" 2>/dev/null \
                | grep -i 'Registration Status' | grep -oE '[A-Za-z]+$' | tr '[:upper:]' '[:lower:]' || true)"
              echo "Registration status after $${_elapsed}s: $${REG_STATUS:-unknown}"
              [ "$$REG_STATUS" = "registered" ] && break

              if [ "$$REG_STATUS" = "inprogress" ]; then
                REG_BALANCE="$$($$MYST cli identities get "$$ID" 2>/dev/null \
                  | grep -i 'Balance:' | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1 || true)"
                case "$${REG_BALANCE:-0}" in
                  ''|0|0.0|0.00|0.000|0.0000|0.00000|0.000000)
                    echo "Registration is inprogress with zero balance; proceeding to funding/order creation."
                    REG_NEEDS_FUNDING=true
                    break
                  ;;
                esac
              fi

              if [ "$$_elapsed" -gt 0 ] && [ "$$(($$_elapsed % $$_retry_interval))" -eq 0 ]; then
                case "$${REG_STATUS:-unknown}" in
                  unregistered|registrationerror|unknown)
                    echo "Registration still $${REG_STATUS:-unknown} after $${_elapsed}s; re-submitting registration request..."
                    submit_registration
                  ;;
                esac
              fi
              sleep 5
              _elapsed="$$(($$_elapsed + 5))"
            done
          fi

          if [ "$$REG_STATUS" = "registered" ]; then
            echo "Identity $$ID registered successfully."
          elif [ "$$REG_NEEDS_FUNDING" = "true" ]; then
            echo "Identity $$ID registration is pending funding; top-up flow will run next."
          elif [ "$$_timeout" != "0" ]; then
            echo "WARNING: Identity $$ID registration did not confirm within $${_timeout}s (status: $${REG_STATUS:-unknown})."
            echo "         Connection attempt will still be made, but may fail until registration completes."
          else
            echo "WARNING: Registration status is still $${REG_STATUS:-unknown}; continuing."
          fi
        else
          echo "Identity $$ID is already registered."
        fi

        # ── Balance / Funding ──────────────────────────────────────────────────────
        BALANCE="$$($$MYST cli identities get "$$ID" 2>/dev/null \
          | grep -i 'Balance:' | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1 || true)"
        echo "Identity: $$ID  |  Balance: $${BALANCE:-unknown} MYST"

        case "$${BALANCE:-0}" in
          ''|0|0.0|0.00|0.000|0.0000|0.00000|0.000000)

            # Show any existing orders so the user can track pending payments.
            echo "Balance is 0. Checking existing payment orders..."
            EXISTING="$$($$MYST cli orders get-all "$$ID" 2>/dev/null || true)"
            [ -n "$$EXISTING" ] && echo "$$EXISTING"

            # Auto-create a new order if all four required vars are set.
            if [ -n "$${MYST_ORDER_AMOUNT:-}" ] && [ -n "$${MYST_ORDER_CURRENCY:-}" ] && \
               [ -n "$${MYST_ORDER_GATEWAY:-}" ] && [ -n "$${MYST_ORDER_COUNTRY:-}" ]; then
              echo "Creating order: $${MYST_ORDER_AMOUNT} MYST via $${MYST_ORDER_GATEWAY} ($${MYST_ORDER_CURRENCY}, country=$${MYST_ORDER_COUNTRY})..."
              $$MYST cli orders create \
                "$$ID" \
                "$${MYST_ORDER_AMOUNT}" \
                "$${MYST_ORDER_CURRENCY}" \
                "$${MYST_ORDER_GATEWAY}" \
                "$${MYST_ORDER_COUNTRY}" || true
            else
              echo "Set MYST_ORDER_AMOUNT / MYST_ORDER_CURRENCY / MYST_ORDER_GATEWAY / MYST_ORDER_COUNTRY"
              echo "to auto-create a funding order on next start. Available gateways:"
              $$MYST cli orders gateways 2>/dev/null | sed 's/^/  /' || true
            fi

            # Optionally block until balance is funded before attempting to connect.
            if [ "$${MYST_WAIT_FOR_FUNDS:-false}" = "true" ]; then
              echo "MYST_WAIT_FOR_FUNDS=true — polling every 30s until balance > 0..."
              while true; do
                sleep 30
                BALANCE="$$($$MYST cli identities get "$$ID" 2>/dev/null \
                  | grep -i 'Balance:' | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1 || true)"
                echo "Funding check: current balance is $${BALANCE:-0} MYST"
                case "$${BALANCE:-0}" in
                  ''|0|0.0|0.00|0.000|0.0000|0.00000|0.000000) ;;
                  *) echo "Balance is now $${BALANCE} MYST. Proceeding."; break ;;
                esac
              done
            fi
          ;;
        esac

        connection_is_up() {
          $$MYST connection info 2>/dev/null \
            | grep -Eiq '"status"[[:space:]]*:[[:space:]]*"Connected"|Status:[[:space:]]*Connected'
        }

        wait_for_connected() {
          _status_timeout="$${MYST_CONNECT_STATUS_TIMEOUT:-30}"
          case "$$_status_timeout" in ''|0) _status_timeout=30 ;; esac

          _elapsed=0
          while [ "$$_elapsed" -lt "$$_status_timeout" ]; do
            if connection_is_up; then
              return 0
            fi
            sleep 2
            _elapsed="$$(($$_elapsed + 2))"
          done
          return 1
        }

        ts_utc() {
          date -u +"%Y-%m-%dT%H:%M:%SZ"
        }

        log_with_ts() {
          echo "[$$(ts_utc)] $$*"
        }

        connect_one_attempt() {
          _svc="$${MYST_SERVICE_TYPE:-wireguard}"
          _loc="$${MYST_LOCATION_TYPE:-residential}"
          _up_timeout="$${MYST_CONNECT_UP_TIMEOUT:-45}"
          case "$$_up_timeout" in ''|0) _up_timeout=45 ;; esac

          # Avoid tearing down an already-established tunnel during retry cycles.
          if connection_is_up; then
            echo "Connection is already established."
            return 0
          fi

          if [ -n "$${MYST_PROVIDER_IDS:-}" ]; then
            OLDIFS="$$IFS"
            IFS=','
            for _provider in $${MYST_PROVIDER_IDS}; do
              _provider="$$(printf '%s' "$${_provider}" | xargs)"
              [ -n "$${_provider}" ] || continue
              log_with_ts "Connection attempt using pinned provider: $${_provider}"
              $$MYST connection down >/dev/null 2>&1 || true
              timeout $${_up_timeout} myst \
                --config-dir="$${OS_DIR_DATA}" \
                --script-dir="$${OS_DIR_CONFIG}" \
                --data-dir="$${OS_DIR_DATA}" \
                --runtime-dir="$${OS_DIR_RUN}" \
                connection up "$${_provider}" --service-type="$${_svc}" --location-type="$${_loc}" || true
              if wait_for_connected; then
                IFS="$$OLDIFS"
                return 0
              fi
            done
            IFS="$$OLDIFS"
            return 1
          fi

          log_with_ts "Connection attempt using provider selection filters (provider_id=auto country=$${MYST_COUNTRY:-any})"
          $$MYST connection down >/dev/null 2>&1 || true
          if [ -n "$${MYST_COUNTRY:-}" ]; then
            timeout $${_up_timeout} myst \
              --config-dir="$${OS_DIR_DATA}" \
              --script-dir="$${OS_DIR_CONFIG}" \
              --data-dir="$${OS_DIR_DATA}" \
              --runtime-dir="$${OS_DIR_RUN}" \
              connection up --country="$${MYST_COUNTRY}" --service-type="$${_svc}" --location-type="$${_loc}" || true
          else
            timeout $${_up_timeout} myst \
              --config-dir="$${OS_DIR_DATA}" \
              --script-dir="$${OS_DIR_CONFIG}" \
              --data-dir="$${OS_DIR_DATA}" \
              --runtime-dir="$${OS_DIR_RUN}" \
              connection up --service-type="$${_svc}" --location-type="$${_loc}" || true
          fi
          wait_for_connected
        }

        if [ "$${MYST_AUTO_CONNECT:-true}" = "true" ] && [ -n "$$ID" ]; then
          _max_attempts="$${MYST_CONNECT_MAX_ATTEMPTS:-6}"
          _retry_interval="$${MYST_CONNECT_RETRY_INTERVAL:-10}"
          case "$$_max_attempts" in ''|0) _max_attempts=1 ;; esac
          case "$$_retry_interval" in ''|0) _retry_interval=10 ;; esac

          _attempt=1
          while [ "$$_attempt" -le "$$_max_attempts" ]; do
            log_with_ts "Connect attempt $$_attempt/$$_max_attempts provider_id=$${MYST_PROVIDER_IDS:-auto}"
            if connect_one_attempt; then
              log_with_ts "Connection established on attempt $$_attempt provider_id=$${MYST_PROVIDER_IDS:-auto}"
              break
            fi

            if [ "$$_attempt" -lt "$$_max_attempts" ]; then
              log_with_ts "Connect attempt $$_attempt failed, retrying in $${_retry_interval}s provider_id=$${MYST_PROVIDER_IDS:-auto}"
              sleep "$$_retry_interval"
            fi
            _attempt="$$(($$_attempt + 1))"
          done

          if ! connection_is_up; then
            log_with_ts "WARNING: All connect attempts failed during startup; healthcheck will continue evaluating readiness."
          fi

          apply_route_exemptions
        fi

        # Keep service in foreground; Myst kill-switch stays enabled unless explicitly disabled.
        wait "$$svc_pid"
