# ══════════════════════════════════════════════════════════════════════════════
# Mysterium Network — Client VPN Container
# ══════════════════════════════════════════════════════════════════════════════
#
# Runs a Mysterium dVPN *client* (consumer) node using the official
# mysteriumnetwork/myst image. It does NOT offer VPN services to the network;
# it only consumes them.
#
# ── FAIL-CLOSED CONFIGURATION ──────────────────────────────────────────────────
# This container is configured with strict fail-closed semantics:
# - Health check verifies tunnel is ACTIVE (Status: Connected), not just API up
# - Services depending on this container will not start until tunnel is established
# - Built-in kill-switch (firewall + outgoing rules) blocks traffic if tunnel drops
# - Shared-namespace containers inherit this protection and cannot bypass the VPN
#
# If tunnel cannot establish: check network configuration (NAT type, firewall, ISP)
# Current known issue: symmetric NAT at ISP level breaks Mysterium P2P tunneling.
#
# ── Sharing this network with other containers ────────────────────────────────
# Other Docker Compose services can route all their traffic through this
# container by setting:
#
#   network_mode: "container:myst-client-vpn"
#
# Those containers will share the network namespace of myst-client-vpn and
# inherit the Myst kill-switch: if the VPN tunnel drops, their traffic is
# blocked rather than falling back to the host network ("fail closed").
#
# ── Wallet / identity storage ─────────────────────────────────────────────────
# Wallet keys and node state are persisted via a bind mount:
#
#   ../docker-data/myst-data  →  /var/lib/mysterium-node  (inside the container)
#   ../docker-data/myst-data  →  /root/.mysterium         (inside the container)
#
# Paths are relative to this file's directory (myst/), so ../docker-data/
# resolves to <project-root>/docker-data/.
#
# The keystore (Ethereum-compatible wallet files) lives under:
#   ../docker-data/myst-data/keystore/
#
# Back up this directory to preserve your identity and any funded balance.
# Identity creation, registration, and payment orders are explicit host-side
# operations (`make vpn-signup-*`); ordinary container startup never mutates
# signup/payment state.
#
# ── Startup sequence ──────────────────────────────────────────────────────────
# 1. Start the Myst daemon (TequilAPI on 127.0.0.1:4050).
# 2. Wait for TequilAPI to become reachable.
# 3. In setup-only mode, wait for explicit host-side commands indefinitely.
# 4. In integrated mode, read/unlock the existing identity without creating,
#    registering, or funding anything.
# 5. Attempt a VPN connection only for an existing registered identity when
#    MYST_AUTO_CONNECT=true.
# 6. Keep the daemon in the foreground; kill-switch remains active.
#
# ── Docker Compose operations ────────────────────────────────────────────────
# Initialize / first start:
#   docker compose up -d
#
# Start an existing stopped container:
#   docker compose start
#
# Follow logs:
#   docker compose logs -f myst-client
#
# Stop the container without deleting state:
#   docker compose stop
#
# Restart after config changes:
#   docker compose up -d
#
# Rebuild / recreate the container:
#   docker compose up -d --force-recreate
#
# Delete the container but keep wallet/state in ../docker-data/myst-data:
#   docker compose down
#
# Delete the container and local wallet/state data:
#   docker compose down
#   rm -rf ../docker-data/myst-data
#
# ── Environment variables ─────────────────────────────────────────────────────
#
# Connection
#   MYST_AUTO_CONNECT        Connect on startup. Default: "true"
#   MYST_SERVICE_TYPE        VPN protocol. Default: "wireguard"
#   MYST_LOCATION_TYPE       Filter providers by node type.
#                            Values: residential | hosting | mobile
#                            Default: "residential"
#   MYST_COUNTRY             Optional ISO 3166-1 alpha-2 country code to
#                            restrict exit node selection (e.g. "US", "DE").
#                            Default: "" (any country)
#   MYST_VPN_PREFERRED_PROVIDER_IDS
#                            Comma-separated provider identity address(es) to
#                            pin to specific nodes (e.g. "0xABC...,0xDEF...").
#                            When set, --location-type and --country are still
#                            applied as secondary filters. Default: ""
#   ONYX_INTEGRATIONS_ALLOW_LAN_ENDPOINTS
#                            When "true", makes approved configured Onyx
#                            integration endpoints on RFC1918 LANs reachable
#                            outside the VPN. Destination policy remains
#                            authoritative for which callers may use them.
#                            Fail-closed behavior remains for non-LAN traffic.
#                            Default: "false"
#
# Funding / Order placement
#   `make vpn-signup-orderform` is the only automatic order owner. It validates
#   the configured values against the live `orders gateways` result and verifies
#   the exact created order before displaying its HTTPS payment URL. Container
#   startup never creates or retries an order.
#
#   Helper commands:
#     ./print-order-gateways.sh
#     ./print-order-gateways.sh myst-client-vpn
#
#   MYST_VPN_ORDER_AMOUNT    MYST amount to purchase (e.g. "10").
#   MYST_VPN_ORDER_CURRENCY  Payment cryptocurrency (e.g. "BTC", "ETH", "USDT").
#                            Source of truth for currently enabled gateway /
#                            currency combinations:
#                              ./print-order-gateways.sh
#                            or:
#                              docker exec myst-client-vpn \
#                                myst cli orders gateways
#   MYST_VPN_ORDER_GATEWAY   Gateway name returned by `orders gateways`.
#                            `coingate` is a known example, not a guaranteed
#                            exhaustive list of options.
#   MYST_VPN_ORDER_COUNTRY   2-letter ISO country code used for tax calculation
#                            (e.g. "US").
#
# ── Capabilities required ─────────────────────────────────────────────────────
# NET_ADMIN + /dev/net/tun are required for WireGuard tunnel management and
# the built-in kill-switch (iptables rules inside the container's netns).
# ══════════════════════════════════════════════════════════════════════════════

services:
  myst-client:
    image: ${MYST_IMAGE:?MYST_IMAGE must be set}
    container_name: myst-client-vpn
    restart: "${MYST_RESTART_POLICY:-unless-stopped}"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.forwarding=0
    # NOTE: Docker Compose resolves relative volume paths relative to this
    # file's directory (myst/). The paths below use ../ to reach the project
    # root, so they work both when run standalone and when extended by the
    # wrapper docker-compose.yaml.
    volumes:
      - ../docker-data/myst-data:/var/lib/mysterium-node
      - ../docker-data/myst-data:/root/.mysterium
      - ./myst-client-entrypoint.sh:/usr/local/bin/myst-client-entrypoint.sh:ro
      - ./child-process-control.sh:/usr/local/bin/myst-child-process-control.sh:ro
      - ./route-reconciliation.sh:/usr/local/bin/myst-route-reconciliation.sh:ro
      - ./myst-readiness.sh:/usr/local/bin/myst-readiness.sh:ro
      - ./myst-healthcheck.sh:/usr/local/bin/myst-healthcheck.sh:ro
    environment:
      # Master switch for the Mysterium VPN. When "false", the entrypoint
      # starts the daemon in idle mode: no kill-switch is armed, no connect
      # attempt is made, and readiness requires a non-myst0 IPv4 default route
      # with no stale myst0. Docker interface numbering depends on network
      # attachment order. The container still joins netns-holder so namespace
      # references stay valid. See myst/myst-client-entrypoint.sh.
      MYST_VPN_ENABLED: "${MYST_VPN_ENABLED:-true}"
      MYST_AUTO_CONNECT: "${MYST_AUTO_CONNECT:-true}"
      # Standalone signup mode starts only the daemon. Identity, registration,
      # and funding mutations are owned exclusively by myst-vpn-cli.sh.
      MYST_SETUP_ONLY: "${MYST_SETUP_ONLY:-false}"
      # Required when the persisted wallet contains more than one identity.
      MYST_VPN_IDENTITY: "${MYST_VPN_IDENTITY:-}"
      # Optional WireGuard interface MTU override passed to the daemon.
      MYST_VPN_WIREGUARD_MTU: "${MYST_VPN_WIREGUARD_MTU:-}"
      # Diagnostic override to skip peer route exclusion during P2P setup.
      MYST_SKIP_PEER_ROUTE_EXCLUDE: "false"
      # Comma-separated hostnames that should bypass myst0 and stay on eth0.
      # Keep broker control-plane traffic on the pre-tunnel path to reduce
      # long-lived TCP resets during interface/route transitions.
      MYST_ROUTE_EXEMPT_HOSTS: "host.docker.internal,broker.mysterium.network"
      # Optional comma-separated IPv4 CIDRs to force through eth0.
      MYST_ROUTE_EXEMPT_CIDRS: ""
      MYST_SERVICE_TYPE: "${MYST_SERVICE_TYPE:-wireguard}"
      MYST_LOCATION_TYPE: "${MYST_LOCATION_TYPE:-residential}"
      MYST_COUNTRY: "${MYST_COUNTRY:-US}"
      MYST_VPN_PREFERRED_PROVIDER_IDS: "${MYST_VPN_PREFERRED_PROVIDER_IDS:-}"
      # Route support for approved configured Onyx integration endpoints on LANs.
      ONYX_INTEGRATIONS_ALLOW_LAN_ENDPOINTS: "${ONYX_INTEGRATIONS_ALLOW_LAN_ENDPOINTS:-false}"
      # Used only to install an exact /32 route for a configured RFC1918
      # proxy literal; names remain subject to the resolver rules in the
      # final-hop broker. The entrypoint never logs the URL or credentials.
      EGRESS_UPSTREAM_PROXY_URL: "${EGRESS_UPSTREAM_PROXY_URL:-}"
      # Connection retry policy (helps with provider-specific transient failures).
      MYST_CONNECT_MAX_ATTEMPTS: "6"
      MYST_CONNECT_RETRY_INTERVAL: "5"
      # Max seconds allowed for each `myst connection up` command invocation.
      # Keep this large enough for successful fast paths while failing quickly on stalls.
      MYST_CONNECT_UP_TIMEOUT: "30"
      # Per-attempt wait budget for observing Connected state after `connection up`.
      MYST_CONNECT_STATUS_TIMEOUT: "15"
      MYSTERIUM_NODE_MODE: "consumer"
      MYST_NODE_MODE: "consumer"
      # Disable DNS updates when sharing network namespace with other containers
      MYST_SKIP_UPDATE_RESOLV_CONF: "true"
      # Legacy firewall-related toggle kept separate from NAT traversal bypasses.
      MYST_FIREWALL_DETECTION_ENABLED: "${MYST_FIREWALL_DETECTION_ENABLED:-true}"
      # Fail-closed: block traffic if connection drops.
      # The idle path (MYST_VPN_ENABLED=false) overrides this to "false" at
      # runtime in myst-client-entrypoint.sh for defense-in-depth.
      MYST_FIREWALL_ENABLED: "${MYST_FIREWALL_ENABLED:-true}"
    healthcheck:
      # VPN mode requires Connected plus a usable myst0 IPv4 route. Explicit
      # no-VPN mode instead requires a usable non-myst0 IPv4 default route and
      # no stale myst0; it must not assume Docker assigned that route to eth0.
      test: ["CMD", "/bin/sh", "/usr/local/bin/myst-healthcheck.sh", "check", "1", "/run/myst-healthcheck", "/usr/local/bin/myst-readiness.sh", "/proc/uptime", "60", "/proc"]
      interval: 1m
      start_interval: 5s
      timeout: 10s
      retries: 2
      # Keep this above worst-case connect startup budget:
      # max_attempts * (connection_up_timeout + status_timeout) + retry_gaps.
      # With defaults: 6 * (30 + 15) + 5 * 5 = 295s.
      start_period: 420s
    entrypoint:
      - /bin/sh
      - /usr/local/bin/myst-client-entrypoint.sh
